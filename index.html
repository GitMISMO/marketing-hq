     </ul>
     It works out the episode from the folder name ("Ep. 51 - …").</li>
   <li><b>Brian pastes his LinkedIn post in the same chat.</b> The "Mic'd Up Writer" prompt in Power Automate rewrites it in MISMO's voice: the YouTube title, the YouTube description and the description for MISMO's LinkedIn Live event. If his post doesn't come through the chat, paste it into step 4 of the kit.</li>
  </ol>
  <p>Then the kit walks through the upload:</p>
  <ol>
   <li><b>Download the final video</b> from Google Drive.</li>
   <li><b>Thumbnail:</b> when there are two, press <b>Use This One</b> on the one that matches Brian's LinkedIn post, then <b>Download</b> it.</li>
   <li><b>Check the transcript:</b> <b>Check untitled.txt</b> lists misspelled names and MISMO terms (MISMO, Mic'd Up, Vieaux, eNote, eClose, eVault, SMART Doc, the guest's name from the folder and more). Untick anything that's right as it is, then <b>Download Corrected Transcript</b> and upload it to YouTube as the captions. Add other names to watch for in the box.</li>
   <li><b>Title and description:</b> copy each into YouTube Studio. <b>Write Again</b> asks for a new version.</li>
   <li><b>Post on YouTube</b>, then paste the YouTube link here. The kit also notices it by itself once the channel lists it.</li>
   <li><b>MISMO LinkedIn Live, Monday 1:00 PM ET:</b> the episode streams from Riverside to MISMO's LinkedIn page, so there's no YouTube link. The kit has the event name and description, written in MISMO's voice. Press <b>Send to Amy for Approval</b>; it shows under Waiting on Amy on the Schedule. Amy presses <b>Approve</b> or <b>Request Changes</b> with a note. Once it's approved, the copy buttons appear, with the steps to create the event on MISMO's page (cover image: the thumbnail from step 2). Paste the event link when it's set up, and press <b>Mark as Streamed</b> after Monday.</li>
  </ol>
  <p><b>Seasons:</b> Season 2 starts over at Episode 1 on November 6, 2026. Each episode has a Season, and a folder named "Ep. 1 - …" is matched to the episode whose Friday is closest, so it never lands on Season 1's Episode 1. Season 2 YouTube titles read "MISMO Mic'd Up Season 2, Episode 1: …".</p>
  <p><b>Pull In a Drive Folder</b> takes any Drive folder link, for an episode posted before the chat was connected. <b>Pull Again</b> rereads the folder if Brian adds files.</p>`},
 {id:"linkedin", t:"LinkedIn", g:"Channels", b:`
  <ul>
   <li><b>Coming Up</b> lists every post in the next six weeks, including the Monday Mic'd Up posts (they appear by themselves once an episode is added) and summit tasks going to LinkedIn.</li>
   <li><b>Ready to Reuse from MISMO Matters</b>: any section with LinkedIn ticked under "Also Use It In." <b>Make a Post</b> starts one with its headline and copy.</li>
   <li><b>News to Share</b>: articles from In the News not yet posted. <b>Make a Post</b> starts one with the link.</li>
   <li><b>Make a Post</b> starts a draft here in MISMO Media. It does not put anything on LinkedIn by itself.</li>
   <li><b>Stage it</b> to have it go up automatically: give it a date and a post time, tick "Stage it," and save. It shows as <b>Staged to Post</b>. Once the posting flow is running (see <b>Posting and Scheduling</b>), it posts on the MISMO page at that time and marks itself posted with its link.</li>
   <li>If you post it yourself, open it, set Status to <b>Posted / Sent</b>, paste the post's link and save. Impressions, clicks, reactions, comments and reposts can be typed in, or brought in from the LinkedIn export on Results.</li>
  </ul>`},
 {id:"posting", t:"Posting and Scheduling", g:"Channels", b:`
  <p>Everything starts as a draft in MISMO Media. Here's what can go out on its own and what's still done in the platform.</p>
  <table class="t"><thead><tr><th>Where</th><th>Can MISMO Media Post It?</th><th>How</th></tr></thead><tbody>
   <tr><td>LinkedIn, posts with a link</td><td>Yes, once the posting flow is set up</td><td>Stage the post with a date and time. A Power Automate flow checks every 15 minutes and posts it on the MISMO company page with "Post an article on company page," using the copy as the post text and the link as the article. The Monday Mic'd Up post links to YouTube, so it fits exactly.</td></tr>
   <tr><td>LinkedIn, image, video or document posts</td><td>No</td><td>Power Automate's LinkedIn connector only posts link posts. Schedule these in LinkedIn itself (the clock icon next to Post on the MISMO page), then set the post's Status to Approved and note the time.</td></tr>
   <tr><td>YouTube uploads</td><td>No</td><td>Power Automate can't upload to YouTube. Upload in YouTube Studio and set Visibility to <b>Schedule</b> for the time you want; it goes public by itself. MISMO Media marks it on YouTube once it's up.</td></tr>
   <tr><td>MISMO Matters</td><td>No</td><td>Built and scheduled in Higher Logic from the HTML.</td></tr>
   <tr><td>Mailchimp</td><td>No</td><td>Scheduled in Mailchimp.</td></tr>
  </tbody></table>
  <h3>How the Posting Flow Works</h3>
  <ol>
   <li>Every 15 minutes it reads the staged LinkedIn posts from marketing-hq-data (posts and the Mic'd Up Monday posts).</li>
   <li>Any whose date and time have arrived, and that haven't gone out, are posted on the MISMO page.</li>
   <li>It writes what it posted, with each post's link, to <code>data/posted.json</code>. Only the flow writes that file. MISMO Media reads it and marks each post as posted, the same way Member 360 reads what its email flow has sent.</li>
  </ol>
  <p>To stop a staged post, untick "Stage it" before its time.</p>`},
 {id:"youtube", t:"YouTube", g:"Channels", b:`
  <ul>
   <li><b>Upload Queue</b>: episodes that have aired, or air this week, and aren't on YouTube yet.</li>
   <li><b>Captions to Fix</b>: episodes on YouTube without proofed captions.</li>
   <li><b>Every Upload</b> is the checklist: title format, Brian's description, captions, the Mic'd Up playlist, the website list and MISMO Matters.</li>
   <li><b>Other Videos</b> logs FRAME videos, the MISMO Initiatives series, webinar recordings and special content.</li>
  </ul>`},
 {id:"mailchimp", t:"Mailchimp", g:"Channels", b:`
  <p>Mailchimp is the stopgap while marketing email moves into Higher Logic. Log each campaign with its subject, audience (for example the compliance list or the tech list), send date and copy. Before any send, pull Mailchimp's latest unsubscribes into the one unsubscribe list. Results come from the Mailchimp export on Results, or the daily feed once it's set up.</p>`},
 {id:"summits", t:"Summits", g:"Channels", b:`
  <ul>
   <li>Pick the summit at the top. The band counts the days to go, what's done and what's due.</li>
   <li><b>Load the Standard Summit Plan</b> lays out about 27 posts and emails before, during and after, dated from the summit's first day: save the date, registration open, early-bird reminders, agenda highlights, speaker spotlights, sponsor thank-yous, countdown, know-before-you-go, daily posts at the summit, award winners, the thank-you and survey, the recap and the MISMO Matters Summit Spotlight. Anything already past is skipped.</li>
   <li>Tick tasks off as they're done. Click one to change its date, owner, where it goes or its copy. <b>+ New Task</b> adds your own.</li>
   <li>Summit planning (the agenda, Run of Show, hotel) stays in Summit HQ. This page is only the marketing.</li>
  </ul>`},
 {id:"news", t:"In the News", g:"Sources", b:`
  <ul>
   <li>Log each MISMO press release and each article that mentions MISMO with <b>+ Add an Article</b>: headline, outlet, date, link, and whether it's a press release or a mention.</li>
   <li>Each item lands in the In the News section of the edition its date falls in. If an older item was missed, set <b>Goes in MISMO Matters</b> to the edition it should run in.</li>
   <li>Items marked <b>Found Automatically</b> came from the weekly search (once it's switched on). Check each one, then untick "Found automatically · needs a look."</li>
   <li>Outlets to check: HousingWire, National Mortgage News, Mortgage News Daily and Chrisman Commentary, Inside Mortgage Finance, Scotsman Guide, National Mortgage Professional, The Mortgage Point, Commercial Observer and MBA NewsLink.</li>
  </ul>`},
 {id:"results", t:"Results and Stats", g:"Sources", b:`
  <p>Results puts every channel's numbers side by side: MISMO Matters open rate, LinkedIn impressions, Mic'd Up views, Mailchimp open rate, subscribers, the most-watched episodes, the posts that reached the most people, and what people download most.</p>
  <h3>Bringing Numbers In by Hand</h3>
  <table class="t"><thead><tr><th>Platform</th><th>Where the Export Is</th><th>How It's Matched</th></tr></thead><tbody>
   <tr><td>YouTube</td><td>YouTube Studio › Analytics › Advanced mode › Content › Export</td><td>By the episode number in the title</td></tr>
   <tr><td>LinkedIn</td><td>MISMO page › Analytics › Content › Export (All Posts tab)</td><td>By the post's link, or its date and wording; unmatched posts are added</td></tr>
   <tr><td>Mailchimp</td><td>Campaigns › Reports › Export</td><td>By subject; unmatched campaigns are added</td></tr>
   <tr><td>MISMO Matters</td><td>Higher Logic's report for the mailing</td><td>Typed into Record Stats on the edition</td></tr>
  </tbody></table>
  <p>Once the daily feed is running (see <b>Daily Stats from Power Automate</b>), YouTube, MISMO Matters and Mailchimp numbers fill themselves in every morning and these exports are only needed for LinkedIn.</p>`},
 {id:"people", t:"Subscribers and Downloaders", g:"Sources", b:`
  <ul>
   <li><b>Look someone up</b> by typing any part of a name, email, organization or title. Pick a list to narrow it. Click a person for their details and everything they've downloaded.</li>
   <li><b>Load a List</b> takes an Excel or CSV export: the website subscriber export, the downloader export, a prospect list, the MISMO Matters group, or an unsubscribe list. Columns are matched by name. People already there are kept and updated; new people are added.</li>
   <li>The first lists loaded are Kelly's website subscribers (64) and downloaders (764) from May 1 to September 8, 2026. New subscribers from the website form are added on their own (see <b>The Subscribe Form</b>).</li>
   <li>This page holds names and email addresses. Share it only with the MISMO team.</li>
  </ul>`},
 {id:"subscribe", t:"The Subscribe Form", g:"Sources", b:`
  <p>The website's Subscribe button opens MISMO's own form at <a href="https://resources.mismo.org/forms/subscribe/" target="_blank" rel="noopener"><b>resources.mismo.org/forms/subscribe/</b></a>, in the website's look. It replaces the Smartsheet form, and the MISMO Matters footer now links to it too.</p>
  <p>To get there fast: <b>Subscribe Form</b> at the bottom of the left menu, or <b>Open Subscribe Form</b> and <b>Copy Form Link</b> on the Website Sign-Ups card under Subscribers.</p>
  <div class="hflow">
   <div><span>On the Website</span><b>Someone Subscribes</b><small>Name, work email, company, title and what interests them</small></div>
   <div><span>Seconds Later</span><b>Higher Logic</b><small>Added to the MISMO Matters list (by CSV until Higher Logic gives us an API user)</small></div>
   <div><span>Same Moment</span><b>MISMO Media</b><small>They appear under Website Sign-Ups on Subscribers</small></div>
  </div>
  <ul>
   <li><b>Website Sign-Ups</b> on the Subscribers page lists the newest first, with whether each person made it into Higher Logic.</li>
   <li>If Higher Logic refused someone, or the automatic step isn't on yet, <b>Copy for Higher Logic</b> copies those people as a CSV to import into the MISMO Matters list by hand.</li>
   <li>The interests people pick (AI and FRAME, eMortgage, Servicing and so on) are kept with each sign-up, ready for targeted sends later.</li>
   <li>Robots are turned away quietly: a hidden field and a speed check stop automated sign-ups without bothering real people.</li>
  </ul>
  <h3>How It's Wired</h3>
  <ol>
   <li>The form sends each sign-up to the <b>MISMO Matters Sign-Ups</b> flow in Power Automate, the same kind of door the certification applications use.</li>
   <li>Once Higher Logic provides a marketing API user, a step goes here that adds the person to the MISMO Matters list automatically. Until then each sign-up arrives marked <b>Pending</b>, and <b>Copy for Higher Logic</b> gives you the CSV to import.</li>
   <li>It then fires a "signup" event at the private marketing-hq-data repository (GitHub's "Create a repository dispatch event" action, connected as Jonna, with the GitMISMO organization's approval for Power Automate). A small GitHub workflow in that repository files it in <code>data/signups.json</code>; no key or password is stored anywhere for this.</li>
   <li>MISMO Media reads that file and shows the sign-up.</li>
  </ol>`},
 {id:"branding", t:"The Rebranding Tracker", g:"Channels", b:`
  <p>The running list of everything that carries MISMO's look, so nothing with the old branding gets missed. Open <b>Rebranding</b> in the left menu.</p>
  <ul>
   <li><b>Add anything branded:</b> marketing materials, documents and templates, slide decks, email templates and signatures, social profiles and video art, web pages and tools, signs, print and summit pieces. Press <b>+ Add Item</b>.</li>
   <li><b>Statuses:</b> <b>To Check</b> (found, not looked at yet), <b>Old Branding</b> (needs replacing), <b>In Progress</b>, <b>Rebranded</b> and <b>Retiring</b> (won't be redone, so it drops out of the percentage).</li>
   <li><b>The boxes at the top</b> show how far along the rebrand is. Press one to see just those items. <b>By Type</b> shows progress for each kind of item, and pressing a type narrows the list to it.</li>
   <li><b>Keep the links:</b> each item can hold where it lives, a link to the old version and a link to the rebranded one. That way the new website, the Image Library and Higher Logic all point at the current files.</li>
   <li>The menu shows how many items still have <b>Old Branding</b>. <b>Archive</b> takes an item off the list without losing it.</li>
  </ul>`},
 {id:"orders", t:"Orders: Pins, Swag and Banners", g:"Channels", b:`
  <p>Anything physical that has to be ordered: pins, swag and giveaways, banners and signs, print, apparel and booth pieces. Open <b>Orders</b> in the left menu.</p>
  <ul>
   <li><b>New Order:</b> say what it is, the type, quantity, vendor and cost, and the <b>Order By</b> and <b>Needed By</b> dates. Move the status along as it goes: To Order, Getting Quotes, Ordered, Shipped, Received.</li>
   <li><b>For an event:</b> pick the summit, or Another Event and type its name and date. The order then shows on that summit's page under <b>Orders for This Summit</b>, and if no Needed By date is set, the event date is used.</li>
   <li><b>On the Schedule:</b> each order's Order By and Needed By dates show on the calendar and in the Orders swimlane, so a banner that has to ship before a summit isn't missed.</li>
   <li><b>Need Attention</b> counts orders that are past their order-by or needed-by date, or needed within two weeks. The menu shows the same count.</li>
   <li><b>Tied to the rebrand:</b> on a Rebranding item, <b>Order a Replacement</b> starts an order already linked to it. The item moves to In Progress, and the order is listed on it.</li>
  </ul>`},
 {id:"images", t:"The Image Library", g:"Sources", b:`
  <p>One place for the pictures every campaign uses. Open <b>Image Library</b> in the left menu.</p>
  <ul>
   <li><b>Add pictures:</b> press <b>+ Add Images</b> (pick several at once) or drag them onto the page. JPG, PNG, GIF, SVG and WebP all work. The original file is kept, full size.</li>
   <li><b>Tag them:</b> press a picture to name it, choose its campaign (MISMO Matters, Mic'd Up, LinkedIn, Mailchimp, Summits and so on) and, for MISMO Matters, its edition. Add alt text so the picture still makes sense when an email blocks images.</li>
   <li><b>Download one:</b> <b>Download</b> on the card, or <b>Download Original</b> inside it, saves the full-size file.</li>
   <li><b>Download many:</b> tick the box on each picture you want and press <b>Download Selected (ZIP)</b>. With nothing ticked, <b>Download All (ZIP)</b> zips everything the filters are showing, for example every picture for the November MISMO Matters.</li>
   <li><b>In a MISMO Matters section:</b> <b>Upload Image</b> adds the picture to the section and to the library, tagged to that edition. <b>Pick from Image Library</b> reuses one that's already there.</li>
   <li><b>Nothing is deleted:</b> tick <b>Archived</b> to hide a picture you no longer need. <b>Show Archived</b> brings archived pictures back into view.</li>
  </ul>
  <h3>Pictures in the Email (Higher Logic)</h3>
  <ul>
   <li>The preview shows each section's picture so the team can review the whole email. A picture that isn't in Higher Logic yet has an orange "Preview only" note under it.</li>
   <li><b>Before sending, every picture goes into Higher Logic's image library.</b> An email can only show pictures stored somewhere public on the web. The Image Library is private to MISMO, so people receiving the email couldn't see pictures from it.</li>
   <li>The steps: download the picture (or the whole edition as a ZIP), upload it to the Higher Logic image library, copy its link, and paste that link into the picture's <b>Link in Higher Logic's Image Library</b> in the Image Library (every section that uses it picks it up) or straight into the section's <b>Image Link in Higher Logic</b>. Then <b>Copy HTML</b> and paste it into Higher Logic. If a link is still missing, Copy HTML tells you, and that picture shows as a placeholder box.</li>
  </ul>
  <h3>Where the Pictures Live</h3>
  <ul>
   <li><b>Claude version:</b> in the page's own private image store.</li>
   <li><b>resources.mismo.org version:</b> MISMO's SharePoint. New pictures are saved to Q Drive › MISMO › Active Documents › Marketing › Marketing HQ Images, in a folder for each month. <b>Add from SharePoint</b> lists pictures that are already in SharePoint (Branding - 2026, for example) without copying them. Only people signed in with access to MISMO Media can see or add them.</li>
  </ul>`},
 {id:"lists", t:"Lists and Unsubscribes", g:"Sources", b:`
  <ul>
   <li><b>The Compound</b> is the set of lists behind the MISMO Matters group: the MBA Annual/IMB/LIRC list, active community members, event attendees, associate contacts, ResTech, website subscribers and downloaders, plus the member contacts, VIPs and current Axios audience still to come. Ciara Durkan at MBA refreshes it quarterly; the next refresh is November.</li>
   <li>Counts only live here. No names are kept on this page.</li>
   <li><b>The unsubscribe rule:</b> one list across every platform. Anyone who unsubscribed in Mailchimp, Axios or Higher Logic is left off every MISMO send, and MISMO's sends stay separate from MBA's Aptify unsubscribes.</li>
  </ul>`},
 {id:"saving", t:"Saving, Access and Where Things Live", g:"Behind the Scenes", b:`
  <ul>
   <li><b>The page</b> lives at <b>resources.mismo.org/marketing-hq/</b>, behind the shared MISMO sign-in (the same one as Summit HQ and Member 360).</li>
   <li><b>The records</b> live in a private GitHub repository, GitMISMO/marketing-hq-data, and are read and saved through the resources.mismo.org relay. Every save is a real change with a record of who made it and when, so anything can be rolled back.</li>
   <li><b>Two people at once:</b> if someone saved the same part a moment before you, your change is laid on top of theirs and saved again, so nobody's work is lost. Other people's changes show up within about a minute.</li>
   <li><b>Access</b> is set per person in People &amp; Access: <b>Admin</b> and <b>Staff</b> can change anything; <b>View</b> can look but not save, and the page says so at the top.</li>
   <li><b>Preview:</b> while the page says "Preview," nothing saves and the team keeps working in the Claude version.</li>
   <li><b>If a save fails</b>, a red line at the bottom says why. "Not saved yet, trying again" means keep the tab open; nothing is lost.</li>
   <li>Uploading images and "Write the LinkedIn Post" work in the Claude version today and will come to resources.mismo.org when the relay supports them.</li>
  </ul>`},
 {id:"automation", t:"Daily Stats from Power Automate", g:"Behind the Scenes", b:`
  <p>Once MISMO Media is saving on resources.mismo.org, a scheduled Power Automate flow can bring the numbers in every morning instead of anyone importing them. The flow writes one file, <code>data/feeds.json</code>, into marketing-hq-data, the same way the Member 360 email flow writes its results file. MISMO Media reads it and fills in Results, the edition stats and the episode views on its own. Typed or imported numbers always win over the feed.</p>
  <table class="t"><thead><tr><th>Source</th><th>Daily?</th><th>How the Flow Gets It</th></tr></thead><tbody>
   <tr><td>MISMO Matters (Higher Logic)</td><td>Yes</td><td>HTTP call to Higher Logic's marketing (Informz) API for each mailing: sent, delivered, unique opens, unique clicks, unsubscribes, bounces. Needs an API user from Higher Logic.</td></tr>
   <tr><td>YouTube</td><td>Yes</td><td>HTTP call to the YouTube Data API with a Google API key for views, likes and comments. Power Automate's own YouTube connector only announces new uploads; it has no view counts.</td></tr>
   <tr><td>Mailchimp</td><td>Yes</td><td>HTTP call to Mailchimp's reports API with a Mailchimp API key.</td></tr>
   <tr><td>LinkedIn</td><td>Not yet</td><td>Power Automate has no LinkedIn analytics action. Page analytics need a LinkedIn developer app approved for organization data. Until then, drop the monthly export on Results.</td></tr>
   <tr><td>Website subscribers</td><td>As they happen</td><td>MISMO's own Subscribe form sends each sign-up straight to Higher Logic and MISMO Media (see <b>The Subscribe Form</b>).</td></tr>
  </tbody></table>
  <p>Staged LinkedIn posts go out through a second flow, described under <b>Posting and Scheduling</b>.</p>
  <h3>What the File Looks Like</h3>
<pre class="hcode">{ "docs": {
  "feeds/youtube":   { "updated": "2026-11-03T11:00:00Z",
                       "videos": { "UlUdGHyQ6v0": { "views": 412, "likes": 18, "comments": 2 } } },
  "feeds/matters":   { "updated": "…", "mailings": [ { "month": "2026-11", "sent": 31250,
                       "delivered": 30710, "opens": 9120, "clicks": 1480, "unsubs": 41,
                       "bounces": 540, "topLinks": ["Winter Summit registration — 212"] } ] },
  "feeds/mailchimp": { "updated": "…", "campaigns": [ { "subject": "…", "date": "2026-11-02",
                       "audience": "Compliance list", "sent": 1800, "opens": 610, "clicks": 95, "unsubs": 3 } ] }
} }</pre>
  <p>The API keys stay inside Power Automate. They never go in the page or in either repository.</p>`},
 {id:"faq", t:"Questions and Fixes", g:"Behind the Scenes", b:`
  <dl class="faq">
   <dt>I don't see a Save button, or the page says view-only.</dt><dd>Your access is View. Ask Jonna to change it in People &amp; Access.</dd>
   <dt>A red line says a change didn't save.</dt><dd>It says why and puts your change back. "Trying again" means it will save once the connection is back; keep the tab open.</dd>
   <dt>A date won't take.</dt><dd>Type it like 11/18/26 or Nov 18, or use the calendar button.</dd>
   <dt>Copy HTML doesn't copy.</dt><dd>A box opens with the HTML already selected. Press <kbd>Ctrl</kbd>+<kbd>C</kbd> (<kbd>⌘</kbd>+<kbd>C</kbd>).</dd>
   <dt>An episode is on YouTube but the page says it isn't.</dt><dd>The YouTube list refreshes every few hours. Open the episode, tick "Posted to YouTube" and paste the link.</dd>
   <dt>An article ran last month but wasn't in that edition.</dt><dd>Open it and set "Goes in MISMO Matters" to this month.</dd>
   <dt>Where do I add something that isn't on any page?</dt><dd>Use <b>+ New Item</b> on the Schedule, or + Add under Getting Set Up.</dd>
  </dl>`}
];
const HL = {id:"start", q:""};
function renderHelp(){
  const el=$("#page-help"); const q=HL.q.trim().toLowerCase();
  const strip=s=>s.replace(/<[^>]+>/g," ").toLowerCase();
  const list=HELP.filter(h=>!q || (h.t+" "+strip(h.b)).toLowerCase().includes(q));
  if(!HELP.find(h=>h.id===HL.id)) HL.id="start";
  const cur=HELP.find(h=>h.id===HL.id);
  const groups=[...new Set(HELP.map(h=>h.g))];
  el.innerHTML='<div class="phead"><div><div class="eyebrow">How to Use MISMO Media</div><h1>Help</h1><div class="sub">Everything about the system: what each page does, the monthly and weekly runs, who does what, and how saving works.</div></div></div>'+
    '<div class="helpwrap"><nav class="helpnav" aria-label="Help topics"><input type="search" class="plain" id="hp-q" placeholder="Search help" value="'+esc(HL.q)+'" autocomplete="off">'+
      groups.map(g=>{ const hs=list.filter(h=>h.g===g); return hs.length?'<div class="hg">'+esc(g)+'</div>'+hs.map(h=>'<button type="button" data-hp="'+h.id+'"'+(h.id===HL.id?' aria-current="true"':'')+'>'+esc(h.t)+'</button>').join(""):""; }).join("")+(list.length?'':'<div class="note" style="padding:8px">Nothing matches.</div>')+
    '</nav><article class="card helpbody"><div class="cb"><div class="eyebrow">'+esc(cur.g)+'</div><h2>'+esc(cur.t)+'</h2>'+cur.b+
      '<div class="helpnext">'+(()=>{ const i=HELP.indexOf(cur); return (i>0?'<button class="btn" type="button" data-hp="'+HELP[i-1].id+'">← '+esc(HELP[i-1].t)+'</button>':'<span></span>')+(i<HELP.length-1?'<button class="btn" type="button" data-hp="'+HELP[i+1].id+'">'+esc(HELP[i+1].t)+' →</button>':''); })()+'</div>'+

function imgEnsure(im){

/* a plain ZIP (stored, no compression: pictures are already compressed) */
const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=CRC_T[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(files){
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  const d=new Date(), dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)), dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate());
  files.forEach(f=>{
    const name=enc.encode(f.name), data=f.data, crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,dt,true); h.setUint16(12,dd,true); h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,name.length,true); h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer), name, data);
    const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true); c.setUint16(12,dt,true); c.setUint16(14,dd,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,name.length,true); c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer), name);
    off+=30+name.length+data.length;
  });
  const csize=cen.reduce((n,p)=>n+p.length,0);
  const e=new DataView(new ArrayBuffer(22)); e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,csize,true); e.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[new Uint8Array(e.buffer)]),{type:"application/zip"});
}

/* ================= Mic'd Up YouTube Kit ================= */
/* Everything Vanessa needs to put an episode on YouTube and on MISMO's LinkedIn, filled in
   for her. The "Mic'd Up Chat" flow sends every message in the MISMO MIC'D UP Teams chat to
   data/chat.json. When Brian posts an episode's Google Drive folder, MISMO Media opens the
   folder (through the Marketing HQ Images flow), finds the final video (the largest .mp4),
   the generated-image thumbnails and the untitled.txt transcript, and files them on the
   episode. When Brian pastes his LinkedIn post in the chat, the "Mic'd Up Writer" prompt
   rewrites it in MISMO's voice: the YouTube title and description and MISMO's LinkedIn post.
   The kit for each episode lives in the "kits" collection under the episode's id. */
const KIT = {ep:"", busy:{}, tx:{}, txIssues:{}, tried:{}};
const DRIVE = ()=> (window.__hqImages && window.__hqImages.drive) || null;
const FOLDER_RX = /drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([A-Za-z0-9_-]{10,})/;
function chatMsgs(){ return vals("chat").sort((a,b)=>String(a.at||"").localeCompare(String(b.at||""))); }
function msgFolder(m){ const l=[].concat(m.links||[], [m.text||""]).join(" "); const x=l.match(FOLDER_RX); return x?x[1]:""; }
function isBrian(m){ return /vieaux|brian/i.test(m.from||""); }
function msgIsPost(m){ return isBrian(m) && !msgFolder(m) && ( (m.links||[]).some(u=>/linkedin\.com/i.test(u)) || String(m.text||"").length>220 ); }
function kitOf(epId){ return (S.kits||{})[epId] || null; }
/* "Ep. 51 - Factual Data - Reno D'Water" → number, topic, guests */
function parseFolder(name){
  const s=String(name||"").replace(/\s+-\s+Google Drive$/i,"").trim();
  const m=s.match(/^\s*ep(?:isode)?\.?\s*#?\s*(\d{1,3})\s*[-–:.]?\s*/i);
  const rest=m?s.slice(m[0].length):s;
  const parts=rest.split(/\s+[-–]\s+/).map(x=>x.trim()).filter(Boolean);
  return {num:m?+m[1]:0, topic:parts[0]||"", guests:parts.slice(1).join(" and ")};
}
function kitVideo(files){ return (files||[]).filter(f=>/\.mp4$/i.test(f.name)||/video\/mp4/i.test(f.type)).sort((a,b)=>(b.size||0)-(a.size||0))[0]||null; }
function kitThumbFiles(files){ return (files||[]).filter(f=>/^generated-image/i.test(f.name)&&/\.(png|jpe?g|webp)$/i.test(f.name)); }
function kitTranscriptFile(files){ return (files||[]).find(f=>/^untitled\.txt$/i.test(f.name)) || (files||[]).find(f=>/\.txt$/i.test(f.name)) || null; }
const driveView = id=>"https://drive.google.com/file/d/"+id+"/view";
const driveFolderUrl = id=>"https://drive.google.com/drive/folders/"+id;
function mb(n){ n=+n||0; return n>=1073741824?(n/1073741824).toFixed(2)+" GB":n>=1048576?Math.round(n/1048576)+" MB":Math.max(1,Math.round(n/1024))+" KB"; }

/* ---------- pulling a folder in ---------- */
async function kitPullFolder(epId, folderId, chatId){
  const dr=DRIVE(); if(!dr){ toast("Brian's Drive folders open on resources.mismo.org."); return; }
  if(KIT.busy[epId]) return; KIT.busy[epId]=true;
  try{
    toast("Opening Brian's Drive folder…", 60000);
    const got=await dr.list(folderId);
    const files=got.files.filter(f=>!f.folder);
    const info=parseFolder(got.name);
    const video=kitVideo(files), tf=kitTranscriptFile(files), thumbs=kitThumbFiles(files);
    const old=kitOf(epId)||{};
    const kit=Object.assign({}, old, {folderId, folderUrl:driveFolderUrl(folderId), folderName:got.name, files:files.map(f=>({id:f.id,name:f.name,size:f.size,type:f.type})),
      video:video?{id:video.id,name:video.name,size:video.size}:null, transcriptId:tf?tf.id:"", chatId:chatId||old.chatId||"", pulledAt:new Date().toISOString()});
    // thumbnails go into the Image Library (and SharePoint), once each
    const have=(old.thumbs||[]);
    const out=[];
    for(const f of thumbs){
      const prev=have.find(t=>t.driveId===f.id && S.images[t.img]);
      if(prev){ out.push(prev); continue; }
      toast("Bringing in the thumbnail "+f.name+"…", 60000);
      const blob=await dr.get(f.id);
      const ext=(f.name.match(/\.([a-z0-9]+)$/i)||["","png"])[1].toLowerCase();
      const file=new File([blob], "Micd-Up-Ep-"+(info.num||"")+"-"+f.name.replace(/[()\s]+/g,"-").replace(/-+/g,"-"), {type:/^image\//.test(blob.type)?blob.type:(ext==="jpg"?"image/jpeg":"image/"+ext)});
      const made=await addImages([file], {campaign:"micdup", name:"Mic'd Up Ep "+(info.num||"")+" Thumbnail ("+f.name.replace(/\.[a-z]+$/i,"")+")", notes:"From Brian's Drive folder: "+got.name});
      if(made[0]) out.push({driveId:f.id, name:f.name, img:made[0].id});
    }
    kit.thumbs=out;
    if(!kit.thumbPick && out.length===1) kit.thumbPick=out[0].img;
    await put("kits", epId, kit);
    // fill the episode from the folder name where it's blank
    const e=S.episodes[epId]||{}; const part={};
    if(!e.fileUrl) part.fileUrl=kit.folderUrl;
    if(!e.fileIn && video) part.fileIn=true;
    if(!e.guests && info.guests) part.guests=info.guests;
    if(Object.keys(part).length) await patch("episodes", epId, part);
    toast("Episode "+(info.num||"")+" kit is ready: "+(video?"video, ":"")+out.length+" thumbnail"+(out.length===1?"":"s")+(tf?", transcript":""), 5000);
  }catch(e){ toast("Couldn't open the Drive folder: "+(e.message||e.code||"try again"), 6000); }
  finally{ KIT.busy[epId]=false; }
}
async function kitWrite(epId, force){
  const dr=DRIVE(); const k=kitOf(epId); if(!dr||!k||!k.brianPost) return;
  if(k.written && !force) return;
  if(KIT.busy["w"+epId]) return; KIT.busy["w"+epId]=true;
  try{
    toast("Writing the YouTube title, description and MISMO's LinkedIn post…", 60000);
    const o=await dr.write(k.folderName||("Ep. "+((S.episodes[epId]||{}).num||"")), k.brianPost);
    const epx=S.episodes[epId]||{};
    const written={title:String(o.youtubeTitle||"").trim().replace(/^MISMO Mic'?d Up Episode\s*(\d+)/i, (m0,n)=>"MISMO Mic'd Up "+((+epx.season||1)>1?"Season "+epx.season+", ":"")+"Episode "+n), desc:String(o.youtubeDescription||o.text||"").trim(), li:String(o.linkedinPost||"").trim()};
    await put("kits", epId, Object.assign({}, kitOf(epId), {written, writtenAt:new Date().toISOString()}));
    const e=S.episodes[epId]||{}, part={};
    if(!e.bvDescription) part.bvDescription=k.brianPost;
    if(written.li && !["review","approved"].includes(kitOf(epId).liStatus||"")){ part.linkedinCopy = written.li.replace(/\s*\[YouTube link\]\s*/gi," ").trim(); }
    if(!e.liEventName && written.title) part.liEventName = liEventName(written.title, epx);
    if(!e.linkedinTime) part.linkedinTime = "1:00 PM ET";
    if(written.title && !e.ytTitle) part.ytTitle=written.title;
    if(written.title && !e.title){ const t=written.title.replace(/^MISMO Mic'?d Up Episode\s*\d+\s*:\s*/i,"").replace(/\s+with\s+.*$/i,"").trim(); if(t) part.title=t; }
    if(Object.keys(part).length) await patch("episodes", epId, part);
    toast("Written. Read it over in the YouTube Kit.", 4000);
  }catch(e){ toast("Couldn't write it: "+(e.message||e.code||"try again"), 6000); }
  finally{ KIT.busy["w"+epId]=false; }
}
/* match chat messages to episodes and fill in whatever's new. Runs for anyone who can edit, on resources.mismo.org. */
let KIT_SYNCING=false;
async function kitSync(){
  if(KIT_SYNCING || !DRIVE() || !CANWRITE || !LOADED.has("chat") || !LOADED.has("kits") || !LOADED.has("episodes")) return;
  KIT_SYNCING=true;
  try{
    const msgs=chatMsgs();
    for(const m of msgs){
      const fid=msgFolder(m); if(!fid) continue;
      if(vals("kits").some(k=>k.folderId===fid) || KIT.tried[fid]) continue;
      KIT.tried[fid]=true;
      // which episode? read the folder name for the number
      let info; try{ info=await DRIVE().list(fid); }catch(e){ continue; }
      const n=parseFolder(info.name).num; if(!n) continue;
      let ep=epByNum(n, String(m.at||"").slice(0,10)||T());
      if(!ep){ const id=epNewId(n); await put("episodes", id, {num:n, season:epNewSeason(), airDate:"", title:"", guests:"", company:""}); ep=S.episodes[id]; }
      await kitPullFolder(ep.id, fid, m.id);
    }
    // Brian's LinkedIn posts: tie each to its episode
    for(const m of msgs){
      if(!msgIsPost(m) || vals("kits").some(k=>k.postChatId===m.id)) continue;
      const said=String(m.text||"").match(/ep(?:isode)?\.?\s*#?\s*(\d{1,3})/i);
      let target=null;
      if(said){ const ep=epByNum(said[1], String(m.at||"").slice(0,10)||T()); if(ep && kitOf(ep.id)) target=ep.id; }
      if(!target){ // the newest folder Brian posted before this, still waiting for its post
        const cands=vals("kits").filter(k=>!k.brianPost && k.chatId).map(k=>({k, at:(S.chat[k.chatId]||{}).at||k.pulledAt||""})).filter(x=>x.at<=String(m.at||"9")).sort((a,b)=>b.at.localeCompare(a.at));
        if(cands[0]) target=cands[0].k.id;
      }
      if(!target) continue;
      const li=(m.links||[]).find(u=>/linkedin\.com/i.test(u))||"";
      const post=String(m.text||"").replace(li,"").trim();
      await put("kits", target, Object.assign({}, kitOf(target), {brianPost:post, brianPostUrl:li, postChatId:m.id, written:null}));
      await kitWrite(target, true);
    }
    // once the episode is on YouTube, put the real link in MISMO's LinkedIn post
  }finally{ KIT_SYNCING=false; }
}

/* ---------- the transcript check ---------- */
/* words the transcription tends to get wrong, and how MISMO writes them */
const TX_TERMS = [
  [/\b(?:mismo|mizmo|miz mo|mis mo|miss mo|mesmo|misemo|mis-mo)\b/gi, "MISMO", s=>s!=="MISMO"],
  [/\b(?:mic'?d up|mike'?d up|miked up|mic up|mic'd-up|micd up)\b/gi, "Mic'd Up", s=>s!=="Mic'd Up"],
  [/\b(?:vieux|vio|veo|viox|vieaux|vyo|vieau|vio's)\b/gi, "Vieaux", s=>s!=="Vieaux"],
  [/\b(?:e-?note|enote)s?\b/gi, "eNote", s=>!/^eNotes?$/.test(s)],
  [/\b(?:e-?close|eclose|e-?closing|eclosing)\b/gi, "eClose", s=>!/^eClos(e|ing)$/.test(s)],
  [/\b(?:e-?vault|evault)s?\b/gi, "eVault", s=>!/^eVaults?$/.test(s)],
  [/\bsmart doc(?:s)?\b/gi, "SMART Doc", s=>!/^SMART Docs?$/.test(s)],
  [/\b(?:fannie may|fanny mae|fanny may)\b/gi, "Fannie Mae", s=>s!=="Fannie Mae"],
  [/\b(?:freddy mac|freddie mack|freddy mack)\b/gi, "Freddie Mac", s=>s!=="Freddie Mac"],
  [/\b(?:ginny mae|ginnie may|ginny may)\b/gi, "Ginnie Mae", s=>s!=="Ginnie Mae"],
  [/\b(?:u-?lad|you lad)\b/gi, "ULAD", s=>s!=="ULAD"],
  [/\b(?:u-?r-?l-?a|earl a)\b/gi, "URLA", s=>s!=="URLA"],
  [/\b(?:gse|g\.s\.e\.)s?\b/g, "GSE", s=>!/^GSEs?$/.test(s)],
  [/\b(?:a\.?i\.?)\b/g, "AI", s=>s!=="AI" && s!=="a" && s!=="i"]
];
function lev(a,b){ a=a.toLowerCase(); b=b.toLowerCase(); const m=a.length,n=b.length; if(Math.abs(m-n)>3) return 9; const d=Array.from({length:m+1},(_,i)=>[i].concat(Array(n).fill(0))); for(let j=1;j<=n;j++) d[0][j]=j; for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
/* names from the folder and the episode (guests, company): flag near-misses like "Reno Dwater" */
function txNames(epId){
  const e=S.episodes[epId]||{}, k=kitOf(epId)||{}, info=parseFolder(k.folderName||"");
  const people=[e.guests, info.guests, k.extraNames].filter(Boolean).join(",").split(/,|\band\b|&/).map(x=>x.trim()).filter(x=>x.length>2);
  const words=new Set(); people.forEach(n=>n.split(/\s+/).forEach(w=>{ w=w.replace(/[^A-Za-z'’-]/g,""); if(w.length>=4 && /^[A-Z]/.test(w)) words.add(w); }));
  const phrases=[e.company, info.topic].concat(String(k.extraNames||"").split(",")).map(x=>String(x||"").trim()).filter(x=>/\s/.test(x)||/^[A-Z]{2,}/.test(x));
  return {words:[...words], phrases};
}
function txCheck(text, epId){
  const issues=[], seen={};
  const add=(found,fix,why)=>{ const key=found+"→"+fix; if(seen[key]) { seen[key].n++; return; } seen[key]={found,fix,why,n:1}; issues.push(seen[key]); };
  TX_TERMS.forEach(([rx,fix,bad])=>{ (text.match(rx)||[]).forEach(s=>{ if(bad(s)) add(s, (/s$/i.test(s)&&/^(eNote|eVault|SMART Doc|GSE)$/.test(fix))?fix+"s":fix, "MISMO style"); }); });
  const {words:names, phrases}=txNames(epId);
  if(names.length){
    const tokens=text.match(/[A-Za-z][A-Za-z'’-]{2,}/g)||[];
    const counts={}; tokens.forEach(t=>counts[t]=(counts[t]||0)+1);
    Object.keys(counts).forEach(t=>{ if(!/^[A-Z]/.test(t)) return; names.forEach(nm=>{ if(t===nm || nm.toLowerCase().includes(t.toLowerCase())) return;
      const dist=lev(t,nm); if(dist<=2 && t.length>=4 && dist/Math.max(t.length,nm.length)<0.34){ const key=t+"→"+nm; if(seen[key]) seen[key].n+=counts[t]; else { seen[key]={found:t,fix:nm,why:"Name from the folder",n:counts[t]}; issues.push(seen[key]); } } }); });
    names.filter(nm=>/['’-]/.test(nm)).forEach(nm=>{ const plain=nm.replace(/['’-]/g,""), spaced=nm.replace(/['’-]/g," ");
      [plain, spaced].forEach(v=>{ const rx=new RegExp("\\b"+v.replace(/\s+/g,"\\s+")+"\\b","gi"); (text.match(rx)||[]).forEach(h=>{ if(h!==nm) add(h, nm, "Name from the folder"); }); }); });
  }
  phrases.forEach(ph=>{ const rx=new RegExp("\\b"+ph.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/\s+/g,"\\s+")+"\\b","gi"); (text.match(rx)||[]).forEach(h=>{ if(h!==ph) add(h, ph, "Company or topic"); }); });
  return issues;
}
function txFixed(text, issues, skip){
  /* one pass, longest first, so a fix is never fixed twice */
  const map={}; issues.forEach((x,i)=>{ if(!(skip && skip[i])) map[x.found]=x.fix; });
  const keys=Object.keys(map).sort((a,b)=>b.length-a.length); if(!keys.length) return text;
  const rx=new RegExp("(^|[^A-Za-z'’])("+keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?=[^A-Za-z]|$)","g");
  return text.replace(rx,(m,p,w)=>p+(map[w]||w));
}
async function kitLoadTranscript(epId){
  const k=kitOf(epId); if(!k||!k.transcriptId||!DRIVE()) return null;
  if(KIT.tx[epId]!=null) return KIT.tx[epId];
  try{ const b=await DRIVE().get(k.transcriptId); KIT.tx[epId]=await b.text(); KIT.txIssues[epId]=txCheck(KIT.tx[epId], epId); }catch(e){ KIT.tx[epId]=""; KIT.txIssues[epId]=[]; toast("Couldn't read the transcript: "+(e.message||"try again"),4000); }
  return KIT.tx[epId];
}

async function draftLinkedIn(b){
  const msg=$("#ep-draft-msg",b), desc=$("#f-bvDescription",b).value.trim(), title=$("#f-title",b).value.trim(), num=$("#f-num",b).value, guests=$("#f-guests",b).value, co=$("#f-company",b).value, url=$("#f-youtubeUrl",b).value.trim();

      "Base it on the host's description below, but write in MISMO's institutional voice, not first person as Brian. 90 to 150 words. One short hook line, two or three sentences on what listeners learn, tag-style mentions written plainly (no @), then a line driving people to watch on YouTube with the link. Add 3 to 5 relevant hashtags including #MISMOMicdUp. American spelling. Plain text only, no markdown.\n\n"+
      "Episode "+num+": "+title+"\nGuests: "+guests+(co?", "+co:"")+"\nYouTube link: "+(url||"[YouTube link]")+"\n\nBrian's description:\n"+desc, {modelTier:"default", onText:({text})=>{ $("#f-linkedinCopy",b).value=text; }});
    $("#f-linkedinCopy",b).value = r.text.trim(); if(PANE) PANE.dirty=true; msg.textContent="Drafted. Read it over, then Save.";

  openPane({eye:"Lists", title:l.name||"New List", data:l, fields:[{k:"name",label:"List",wide:true},{k:"source",label:"From"},{k:"covers",label:"Covers"},{k:"rows",label:"Rows",type:"number"},{k:"unique",label:"Unique Emails",type:"number"},{k:"refreshed",label:"Refreshed",type:"date"},{k:"notes",label:"Notes",type:"textarea",rows:3}],
    save:async v=>{ await put("lists",nid,Object.assign({},l,v)); }, del:id?async()=>remove("lists",id):null });
}

/* ================= rail (Summit HQ, verbatim except gather) ================= */
(function(){
  const KEY='hq.rail.off';
  function set(off, remember){
    document.body.classList.toggle('railmini', !!off);
    const h=document.getElementById('rail-hide');
    if(h){ h.setAttribute('aria-expanded', off?'false':'true'); h.setAttribute('aria-label', off?'Open the menu':'Narrow the menu'); h.title = (off?'Open the menu':'Narrow the menu')+' (backslash)'; }
    if(off) close();
    if(remember!==false){ try{ localStorage.setItem(KEY, off?'1':'0'); }catch(e){} }
    setTimeout(()=>{ window.dispatchEvent(new Event('resize')); }, 230);
  }
  function toggle(){ set(!document.body.classList.contains('railmini')); }
  function start(){
    let off=null;
    try{ const v=localStorage.getItem(KEY); if(v!==null) off=(v==='1'); }catch(e){}
    if(off===null) off = window.matchMedia('(max-width:900px)').matches;
    set(off, false);
    const h=document.getElementById('rail-hide'); if(h) h.addEventListener('click',toggle);
    const sc=document.getElementById('rail-scrim'); if(sc) sc.addEventListener('click',()=>set(true));
    const qb=document.getElementById('rail-qb');
    if(qb) qb.addEventListener('click',()=>{ set(false); setTimeout(()=>{ const q=document.getElementById('rail-q'); if(q) q.focus(); },230); });
    document.querySelectorAll('.hq nav button[data-hq]').forEach(b=>{
      b.addEventListener('click',()=>{ show(b.dataset.hq); if(window.matchMedia('(max-width:900px)').matches) set(true); });
    });
    wireFind();
  }
  document.addEventListener('keydown',e=>{
    const t=e.target; const typing = t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
    if(e.key==='Escape' && PANE && !typing){ closePane(); return; }
    if(e.key==='\\' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); toggle(); }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); set(false); setTimeout(()=>{ const q=document.getElementById('rail-q'); if(q){ q.focus(); q.select(); } }, 230); }
  });
  const HITS=()=>document.getElementById('rail-hits');
  let picked=-1, rows=[];
  function norm(x){ return String(x||'').replace(/\s+/g,' ').trim().toLowerCase(); }
  function gather(q){
    const t=norm(q); if(t.length<2) return [];
    const out=[];
    const score=(name)=>{ const n=norm(name); return n===t ? 3 : n.indexOf(t)===0 ? 2 : n.indexOf(t)>=0 ? 1 : 0; };
    const push=(group,name,where,go_,hay)=>{ if(out.length<60) out.push({group,name,where,go:go_,s:Math.max(score(name), hay&&norm(hay).indexOf(t)>=0?1:0)}); };
    try{ editionsSorted().forEach(ed=>{ edSections(ed).forEach(s=>{ const nm=(s.doc.headline||s.doc.name||s.meta.name); const hay=[s.meta.name,s.doc.headline,s.doc.body,s.doc.quoteBy].join(" "); if(norm(hay).indexOf(t)<0) return; push('MISMO Matters', nm, s.meta.name+' · '+monthName(ed.month), ()=>{ go('matters'); MS.ed=ed.id; MS.sub="sections"; renderMatters(); if(!ed.archived) openSection(ed,s.k); }, hay); }); }); }catch(e){}
    try{ vals("episodes").forEach(e=>{ const hay=["Episode "+e.num,e.title,e.guests,e.company].join(" "); if(norm(hay).indexOf(t)<0) return; push("Mic'd Up", "Ep "+(e.num||"?")+": "+(e.title||""), [e.guests,e.company].filter(Boolean).join(", "), ()=>{ go('micdup'); openEpisode(e.id); }, hay); }); }catch(e){}
    try{ vals("pieces").forEach(p=>{ const hay=[p.title,p.copy,p.notes,p.kind].join(" "); if(norm(hay).indexOf(t)<0) return; push(CH[p.channel]||"Items", p.title||"Untitled", fS(p.date)+(p.owner?" · "+p.owner:""), ()=>{ const tab={linkedin:"linkedin",youtube:"youtube",mailchimp:"mailchimp",summit:"summits"}[p.channel]||"overview"; go(tab); openPiece(p.id); }, hay); }); }catch(e){}
    try{ HELP.forEach(h=>{ const hay=h.t+" "+h.b.replace(/<[^>]+>/g," "); if(norm(hay).indexOf(t)<0) return; push("Help", h.t, h.g, ()=>{ HL.id=h.id; go('help'); renderHelp(); }, hay); }); }catch(e){}
    try{ vals("news").forEach(n=>{ const hay=[n.headline,n.outlet].join(" "); if(norm(hay).indexOf(t)<0) return; push("In the News", n.headline||"", (n.outlet||"")+" · "+fS(n.date), ()=>{ go('news'); openNews(n.id); }, hay); }); }catch(e){}
    try{ vals("orders").filter(o=>!o.archived).forEach(o=>{ const hay=[o.name,o.kind,o.vendor,o.notes,orEventName(o)].join(" "); if(norm(hay).indexOf(t)<0) return; push("Orders", o.name||"Order", (OR_STAT[o.status||"toorder"]||[""])[0]+(orEventName(o)?" · "+orEventName(o):""), ()=>{ go('orders'); openOrder(o.id); }, hay); }); }catch(e){}
    try{ vals("branding").filter(b=>!b.archived).forEach(b=>{ const hay=[b.name,b.kind,b.where,b.notes].join(" "); if(norm(hay).indexOf(t)<0) return; push("Rebranding", b.name||"Item", (BR_STAT[b.status||"check"]||[""])[0]+(b.kind?" · "+b.kind:""), ()=>{ go('branding'); openBrand(b.id); }, hay); }); }catch(e){}
    try{ vals("images").filter(i=>!i.archived).forEach(im=>{ const hay=[im.name,im.file,im.alt,im.credit,im.notes].join(" "); if(norm(hay).indexOf(t)<0) return; push("Images", im.name||im.file||"Image", (IMG_CAMP[im.campaign]||"Image Library"), ()=>{ go('images'); openImage(im.id); }, hay); }); }catch(e){}
    const best={}; out.forEach(h=>{ best[h.group]=Math.max(best[h.group]||0, h.s); });
    const ORDER=['MISMO Matters',"Mic'd Up",'LinkedIn','YouTube','Mailchimp','Summits','In the News','Rebranding','Orders','Images','Setup','Help'];
    out.sort((a,b)=>(best[b.group]-best[a.group])||(ORDER.indexOf(a.group)-ORDER.indexOf(b.group))||(b.s-a.s)||String(a.name).localeCompare(String(b.name)));
    return out;
  }
  function draw(list){
    const box=HITS(); if(!box) return; box.textContent=''; rows=[]; picked=-1;
    if(!list.length){ const n=document.createElement('div'); n.className='rh-none'; n.textContent='Nothing matches.'; box.appendChild(n); box.hidden=false; return; }
    let g=null;
    list.slice(0,24).forEach(h=>{
      if(h.group!==g){ g=h.group; const hd=document.createElement('div'); hd.className='rh-g'; hd.textContent=g; box.appendChild(hd); }
      const b=document.createElement('button'); b.type='button'; b.className='rh';
      const nm=document.createElement('b'); nm.textContent=h.name; b.appendChild(nm);
      if(h.where){ const w=document.createElement('i'); w.textContent=h.where; b.appendChild(w); }
      b.addEventListener('click',()=>{ close(); h.go(); }); rows.push(b); box.appendChild(b);
    });
    box.hidden=false;
  }
  function close(){ const b=HITS(); if(b){ b.hidden=true; b.textContent=''; } rows=[]; picked=-1; }
  function mark(){ rows.forEach((r,i)=>r.classList.toggle('on', i===picked)); if(rows[picked]) try{ rows[picked].scrollIntoView({block:'nearest'}); }catch(e){} }
  function wireFind(){
    const q=document.getElementById('rail-q'), x=document.getElementById('rail-qx'); if(!q) return;
    let tmr=null;
    const run=()=>{ const v=q.value; if(x) x.hidden = !v; if(norm(v).length<2){ close(); return; } draw(gather(v)); };
    q.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(run,150); });
    q.addEventListener('focus',()=>{ if(norm(q.value).length>=2) run(); });
    q.addEventListener('keydown',e=>{
      if(e.key==='Escape'){ close(); q.blur(); return; }
      if(!rows.length) return;
      if(e.key==='ArrowDown'){ e.preventDefault(); picked=(picked+1)%rows.length; mark(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); picked=(picked-1+rows.length)%rows.length; mark(); }
      else if(e.key==='Enter'){ e.preventDefault(); (rows[picked]||rows[0]).click(); }
    });
    if(x) x.addEventListener('click',()=>{ q.value=''; x.hidden=true; close(); q.focus(); });
    document.addEventListener('click',e=>{ if(!e.target.closest('.railfind')) close(); });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
  window.__rail={ show:()=>set(false), hide:()=>set(true), toggle, mini:()=>document.body.classList.contains('railmini') };
})();

/* ================= theme toggle (shared key) ================= */
(function theme(){
  var btn = document.getElementById("theme-btn"); if(!btn) return;
  function cur(){ var t = document.documentElement.getAttribute("data-theme"); if(t) return t; return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
  function paint(){ const dark = cur() === "dark"; const lab = document.getElementById("theme-lab"); if(lab) lab.textContent = dark ? "Light Mode" : "Dark Mode"; else btn.textContent = dark ? "Light Mode" : "Dark Mode"; btn.title = "Switch to " + (dark ? "light" : "dark") + " mode"; }
  btn.addEventListener("click", function(){ document.documentElement.setAttribute("data-theme", cur() === "dark" ? "light" : "dark"); paint(); try{ localStorage.setItem("mismo.portal.theme", cur()); }catch(e){} window.dispatchEvent(new Event("resize")); });
  try{ var saved = localStorage.getItem("mismo.portal.theme"); if(saved) document.documentElement.setAttribute("data-theme", saved); }catch(e){}
  paint();
})();
(function season(){ if(new Date().getMonth() === 11) document.documentElement.setAttribute("data-season","december"); })();
