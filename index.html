<!doctype html>
<!--
  Marketing HQ, resources.mismo.org/marketing-hq/
  BEFORE UPLOADING A NEW COPY OF THIS FILE: download the current index.html from GitHub first
  and make your changes to that copy. Uploading an older copy silently undoes everything that
  changed since.
  Built the same way as Member 360, Summit HQ and the IIF Planning HQ: the shared resources.mismo.org
  sign-in (/assets/session.js) and the one door to the save relay (project key "marketing-hq", data
  in the PRIVATE repository GitMISMO/marketing-hq-data). No GitHub token or other secret ever goes
  in this file, and no records either: they all arrive from marketing-hq-data after sign-in.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marketing HQ</title>
<!-- Hide the app until someone is signed in. If this file is replaced by an upload, carry this block across. -->
<style>html.hq-out body > *:not(#hq-gate):not(.rs-scrim){visibility:hidden}</style>
<script>(function(){
  var out = true;
  try {
    var s = JSON.parse(localStorage.getItem('resources:session') || 'null');
    out = !(s && s.token && s.expiresAt && Date.parse(s.expiresAt) > Date.now());
  } catch (e) { out = true; }
  document.documentElement.classList.add(out ? 'hq-out' : 'hq-in');
})();</script>
<script src="/assets/session.js"></script>
<script>(function(){
  function sync(){
    var rs = window.ResourcesSession, inn = !!(rs && rs.current());
    document.documentElement.classList.toggle('hq-out', !inn);
    document.documentElement.classList.toggle('hq-in', inn);
  }
  if (window.ResourcesSession) { window.ResourcesSession.onChange(sync); sync(); }
  else { document.addEventListener('DOMContentLoaded', function(){
    if (window.ResourcesSession) { window.ResourcesSession.onChange(sync); sync(); }
    else document.documentElement.classList.remove('hq-out');   // module missing: do not lock the page
  }); }
})();</script>
<script>
/* ============================================================================
   MARKETING HQ ON resources.mismo.org - the one door to MISMO's save relay
   ----------------------------------------------------------------------------
   Built the same way as Member 360's, Summit HQ's and the IIF Planning HQ's doors.
   Marketing HQ was built inside Claude, where it reached its records through
   window.claude.use('db'). This gives the page that same door, backed by the save
   relay instead, so none of the tabs change.

   Where the data lives: the PRIVATE repository GitMISMO/marketing-hq-data, reached
   only through the relay under the project key "marketing-hq". This PUBLIC page
   holds no records at all: editions, episodes, posts, news, lists and the
   subscriber and downloader lists all arrive after sign-in.

   How documents are filed (the relay has no "list a folder" route):
     editions, sections, episodes, pieces, news, lists
                         one file per collection: {docs:{"<collection>/<id>": {...}}}
     audience-...        the subscriber and downloader lists, one file per part:
                         {doc:{...}}, listed in own-index so the collection can be read

   PREVIEW: while PREVIEW is true, the page opens for everyone with access but saves
   nothing, and says so. Switching on = set PREVIEW to false, after Claude re-copies
   the latest records from the Claude version into marketing-hq-data.

   Saving: every save sends the version (sha) it last read. If someone else saved
   in between, the relay answers 409; the change is re-applied on top of theirs and
   sent again. Other people's changes are re-read every minute while the page is open.

   Sign-in is the shared resources.mismo.org sign-in (/assets/session.js). Who may
   open it, and who may save, is set per person in People & Access.
   ========================================================================== */
(function () {
  'use strict';
  if (window.__hqRelay) return;

  var RELAY_URL = 'https://rgvdi67cg27o5kcmiytcqbqnrm0hmztx.lambda-url.us-east-1.on.aws';
  var PROJECT = 'marketing-hq', TOOL = 'Marketing HQ';
  var PREVIEW = true;           /* see the header: false once Marketing HQ is switched on */
  var POLL_MS = 60000, IDLE_POLL_MS = 180000, IDLE_AFTER = 10 * 60000, COOL_POLL_MS = 1800000;
  /* collections whose documents each get a file of their own (the big synced ones) */
  var OWN = ['audience'];
  function hot(name) { return !/^audience-|^own-index$/.test(name); }
  var FLUSH_MS = 350, RETRY_MS = 8000;
  var MAX_FILE = 940000;        /* the relay takes at most 1,000,000 bytes a save */

  /* ---------- browser storage: every tool shares this web address ----------
     This page's own keys (the remembered menu width and the like) are filed under
     tools:marketing-hq: so they cannot collide with another tool's. The sign-in and the
     MISMO theme are shared on purpose and are left alone. */
  (function () {
    var P = 'tools:marketing-hq:';
    var shared = function (k) { k = String(k); return k.indexOf('tools:') === 0 || k.indexOf('resources:') === 0 || k === 'mismo.portal.theme'; };
    try {
      var S = Storage.prototype, g = S.getItem, s = S.setItem, r = S.removeItem;
      S.getItem = function (k) { return g.call(this, shared(k) ? k : P + k); };
      S.setItem = function (k, v) { return s.call(this, shared(k) ? k : P + k, v); };
      S.removeItem = function (k) { return r.call(this, shared(k) ? k : P + k); };
    } catch (e) {}
  })();

  function RS() { return window.ResourcesSession || null; }
  function clone(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
  function safe(s) { return String(s).toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/-{3,}/g, '--').replace(/^-+|-+$/g, '') || 'x'; }
  function err(code, message, status) { var e = new Error(message || code); e.code = code; e.status = status || 0; return e; }
  function now() { return Date.now(); }

  /* ---------- where a document is filed ---------- */
  function place(path) {
    var seg = String(path).split('/');
    if (seg.length !== 2) throw err('invalid_argument', 'Not a document path: ' + path);
    if (OWN.indexOf(seg[0]) >= 0) return { file: safe(seg[0] + '-' + seg[1]).slice(0, 40), own: true, coll: seg[0], id: seg[1] };
    return { file: safe(seg[0]).slice(0, 40), coll: seg[0], id: seg[1] };
  }
  function parentOf(path) { var s = String(path).split('/'); return s.slice(0, -1).join('/'); }
  function idOf(path) { var s = String(path).split('/'); return s[s.length - 1]; }

  /* ---------- talking to the relay ---------- */
  var status = { offline: false, lastError: '' };
  function net(method, name, body) {
    var rs = RS(), tok = rs && rs.token();
    if (!tok) return Promise.reject(err('SIGNED_OUT', 'Not signed in', 401));
    var headers = { 'Authorization': 'Bearer ' + tok };
    if (body) headers['Content-Type'] = 'application/json';
    return fetch(RELAY_URL + '/' + PROJECT + '/data/' + encodeURIComponent(name), {
      method: method, cache: 'no-store', headers: headers, body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      status.offline = false;
      return r.json().catch(function () { return {}; }).then(function (b) {
        if (r.ok) return b;
        var e = err((b && b.error) || ('HTTP_' + r.status), b && b.message, r.status);
        e.gh = (b && typeof b.status === 'number') ? b.status : 0;   /* what GitHub itself answered */
        if (r.status === 401 && rs) { needSignIn(); }
        throw e;
      });
    }, function () { status.offline = true; throw err('OFFLINE', 'Could not reach the relay', 0); });
  }

  /* ---------- files ---------- */
  var F = {};
  function file(name, own) {
    if (!F[name]) F[name] = { name: name, own: !!own, server: null, sha: null, loaded: false, loading: null,
      loadedAt: 0, pending: [], timer: null, flushing: false, view: null, waitingSignIn: false };
    return F[name];
  }
  function normalise(f, c) {
    c = c && typeof c === 'object' ? c : {};
    if (f.own) return { doc: c.doc === undefined ? null : c.doc };
    return { docs: c.docs && typeof c.docs === 'object' ? c.docs : {} };
  }
  function load(f) {
    if (f.loading) return f.loading;
    f.loading = net('GET', f.name).then(function (b) {
      return { content: normalise(f, b && b.data), sha: (b && b.sha) || null };
    }, function (e) {
      /* the relay answers a missing file with {data:null}; a 404 means something else is
         wrong (most often UNKNOWN_PROJECT) and must not be mistaken for an empty file */
      if (e && e.status === 404 && (e.code === 'NOT_FOUND' || e.code === 'HTTP_404')) return { content: normalise(f, null), sha: null };
      throw e;
    }).then(function (got) {
      var before = f.loaded ? JSON.stringify(f.server) : null;
      f.server = got.content; f.sha = got.sha; f.loaded = true; f.loadedAt = now(); f.view = null;
      f.loading = null;
      if (before !== JSON.stringify(f.server)) notify(f, false);
      return f;
    }, function (e) { f.loading = null; throw e; });
    return f.loading;
  }
  function ensure(f) { return f.loaded ? Promise.resolve(f) : load(f); }

  function applyOps(f, content, ops) {
    ops.forEach(function (op) {
      if (f.own) {
        if (op.kind === 'set') content.doc = clone(op.data);
        else if (op.kind === 'update') content.doc = Object.assign({}, content.doc || {}, clone(op.data));
        else if (op.kind === 'delete') content.doc = null;
        return;
      }
      if (op.kind === 'set') content.docs[op.path] = clone(op.data);
      else if (op.kind === 'update') content.docs[op.path] = Object.assign({}, content.docs[op.path] || {}, clone(op.data));
      else if (op.kind === 'delete') delete content.docs[op.path];
    });
    return content;
  }
  function viewOf(f) {
    if (!f.loaded) return null;
    if (!f.view) f.view = applyOps(f, clone(f.server), f.pending);
    return f.view;
  }
  function docIn(f, path) {
    var v = viewOf(f); if (!v) return undefined;
    var d = f.own ? v.doc : v.docs[path];
    return d === undefined ? null : d;
  }

  /* ---------- saving ---------- */
  function queue(path, kind, data) {
    if (PREVIEW) {
      if (now() - previewWarned > 4000) { previewWarned = now(); toast('This is the preview of Marketing HQ on resources.mismo.org \u2014 nothing here is saved. Keep using the Claude version until it\u2019s switched on.', 'bad'); }
      return Promise.reject(err('invalid_argument', 'Preview: not saved'));
    }
    var p = place(path), f = file(p.file, p.own);
    return new Promise(function (res, rej) {
      var go = function () {
        if (kind === 'update' && f.loaded && docIn(f, path) === null) { rej(err('not-found', 'No document to update: ' + path)); return; }
        f.pending.push({ kind: kind, path: path, data: data, res: res, rej: rej }); f.view = null;
        if (p.own) register(path, kind !== 'delete');
        notify(f, true);
        schedule(f, FLUSH_MS);
      };
      if (kind === 'update' && !f.loaded) ensure(f).then(go, function (e) { rej(e); });
      else { if (!f.loaded) ensure(f).catch(function () {}); go(); }
    });
  }
  var previewWarned = 0;
  /* files that hold one document each are listed in own-index, so a collection can be read back */
  function register(path, present) {
    var r = file('own-index');
    var known = r.loaded ? !!(viewOf(r).docs[path]) : null;
    if (known === present) return;
    r.pending.push({ kind: present ? 'set' : 'delete', path: path, data: present ? { file: place(path).file } : null,
      res: function () {}, rej: function () {} });
    r.view = null;
    if (!r.loaded) ensure(r).catch(function () {}); else notify(r, true);
    schedule(r, FLUSH_MS);
  }
  function schedule(f, ms) {
    if (f.timer) return;
    f.timer = setTimeout(function () { f.timer = null; flush(f); }, ms);
  }
  /* GitHub makes one commit to a branch at a time, so every save goes out after the
     one before it has finished, never side by side. */
  var putChain = Promise.resolve();
  function put(name, body) {
    var go = function () { return net('PUT', name, body); };
    var p = putChain.then(go, go);
    putChain = p.then(function () {}, function () {});
    return p;
  }
  function flush(f) {
    if (f.flushing || !f.pending.length) return;
    if (!(RS() && RS().token())) { f.waitingSignIn = true; needSignIn(); return; }
    f.flushing = true;
    var batch = f.pending.slice(), tries = 0;
    var attempt = function () {
      return ensure(f).then(function () {
        var next = applyOps(f, clone(f.server), batch);
        /* the relay saves files pretty-printed and can only read back a file under 1 MB, so the pretty size is what counts */
        if (JSON.stringify(next, null, 2).length > MAX_FILE) throw err('TOO_BIG', 'This part of Marketing HQ has grown too big to save in one piece.');
        return put(f.name, { content: next, sha: f.sha }).then(function (b) {
          f.server = next; f.sha = (b && b.sha) || f.sha; f.loadedAt = now();
          f.pending = f.pending.filter(function (op) { return batch.indexOf(op) < 0; }); f.view = null;
          batch.forEach(function (op) { op.res(); });
          notify(f, false);
          saved();
        });
      }).catch(function (e) {
        if (e && e.status === 409 && tries < 8) {
          tries++;
          f.loaded = false;
          return new Promise(function (r) { setTimeout(r, 300 * tries + Math.random() * 500); })
            .then(function () { return load(f); }).then(attempt);
        }
        throw e;
      });
    };
    attempt().catch(function (e) {
      /* a 502 from the relay with TOKEN or GITHUB is a setup problem, not a blip: say so at
         once rather than retrying quietly forever */
      var transient = e && (e.code === 'OFFLINE' || e.status === 401 || e.code === 'SIGNED_OUT' ||
        (e.status >= 500 && e.code !== 'TOKEN' && e.code !== 'GITHUB' && e.code !== 'REJECTED') ||
        (e.code === 'GITHUB' && (e.gh >= 500 || !e.gh && /timed? ?out|ETIMEDOUT|ECONNRESET|fetch failed/i.test(e.message || ''))));
      if (transient) {
        /* nothing is lost: the change stays queued and goes out once the relay is back */
        if (e.status === 401 || e.code === 'SIGNED_OUT') f.waitingSignIn = true;
        else setTimeout(function () { schedule(f, 0); }, RETRY_MS);
        problem(e);
        return;
      }
      f.pending = f.pending.filter(function (op) { return batch.indexOf(op) < 0; }); f.view = null;
      batch.forEach(function (op) { op.rej(e); });
      notify(f, false);
      problem(e, true);
    }).then(function () {
      f.flushing = false;
      if (f.pending.length && !f.waitingSignIn) schedule(f, FLUSH_MS);
    });
  }
  function anyPending() { return Object.keys(F).some(function (k) { return F[k].pending.length; }); }
  window.addEventListener('beforeunload', function (e) {
    if (anyPending()) { e.preventDefault(); e.returnValue = 'Marketing HQ is still saving.'; return e.returnValue; }
  });

  /* ---------- snapshots and listeners ---------- */
  function docSnap(path, data, pending) {
    var exists = data !== null && data !== undefined;
    return { id: idOf(path), exists: exists, ref: { id: idOf(path), path: path },
      data: function () { return exists ? clone(data) : undefined; },
      metadata: { hasPendingWrites: !!pending, fromCache: false } };
  }
  var docL = [], collL = [];
  function docValue(path) {
    var p = place(path);
    return docIn(file(p.file, p.own), path);
  }
  function isOwn(coll) { return OWN.indexOf(coll) >= 0; }
  function ownPaths(coll) {
    var r = viewOf(file('own-index')); if (!r) return [];
    return Object.keys(r.docs).filter(function (p) { return parentOf(p) === coll; });
  }
  function collDocs(coll) {
    var out = {};
    if (isOwn(coll)) {
      ownPaths(coll).forEach(function (p) { var f = F[place(p).file]; if (f && f.loaded) { var d = docIn(f, p); if (d !== null) out[p] = d; } });
      return out;
    }
    var v = viewOf(file(place(coll + '/x').file));
    if (v) Object.keys(v.docs).forEach(function (p) { if (parentOf(p) === coll) out[p] = v.docs[p]; });
    return out;
  }
  /* the files a collection's listeners depend on */
  function filesOfColl(coll) {
    if (!isOwn(coll)) return [place(coll + '/x').file];
    return ['own-index'].concat(ownPaths(coll).map(function (p) { return place(p).file; }));
  }
  function loadColl(coll) {
    if (!isOwn(coll)) return ensure(file(place(coll + '/x').file));
    return ensure(file('own-index')).then(function () {
      return Promise.all(ownPaths(coll).map(function (p) { return ensure(file(place(p).file, true)); }));
    });
  }
  function collSnap(coll, changes, pending) {
    var docs = collDocs(coll), list = Object.keys(docs).map(function (p) { return docSnap(p, docs[p], pending); });
    return { docs: list, size: list.length, empty: !list.length,
      forEach: function (fn) { list.forEach(fn); },
      docChanges: function () { return changes || list.map(function (d) { return { type: 'added', doc: d }; }); },
      metadata: { hasPendingWrites: !!pending, fromCache: false } };
  }
  function notify(f, pending) {
    if (f.name === 'own-index') collL.forEach(function (l) {   /* a new own document: load it */
      if (isOwn(l.coll)) ownPaths(l.coll).forEach(function (p) { var of = file(place(p).file, true); if (!of.loaded && !of.loading) ensure(of).catch(function () {}); });
    });
    docL.forEach(function (l) {
      if (place(l.path).file !== f.name || !f.loaded) return;
      var d = docValue(l.path), sig = JSON.stringify(d);
      if (l.primed && sig === l.sig) return;
      l.primed = true; l.sig = sig;
      try { l.cb(docSnap(l.path, d, pending)); } catch (e) { console.error(e); }
    });
    collL.forEach(function (l) {
      var files = filesOfColl(l.coll);
      if (files.indexOf(f.name) < 0) return;
      if (!files.every(function (n) { return file(n).loaded; })) return;
      var docs = collDocs(l.coll), changes = [], seen = {};
      Object.keys(docs).forEach(function (p) {
        var sig = JSON.stringify(docs[p]); seen[p] = 1;
        if (!(p in l.last)) changes.push({ type: 'added', doc: docSnap(p, docs[p], pending) });
        else if (l.last[p] !== sig) changes.push({ type: 'modified', doc: docSnap(p, docs[p], pending) });
        l.last[p] = sig;
      });
      Object.keys(l.last).forEach(function (p) {
        if (!seen[p]) { changes.push({ type: 'removed', doc: docSnap(p, null, pending) }); delete l.last[p]; }
      });
      if (l.primed && !changes.length) return;
      l.primed = true;
      try { l.cb(collSnap(l.coll, changes, pending)); } catch (e) { console.error(e); }
    });
  }

  /* ---------- the store, in the shape the tabs already use ---------- */
  function docRef(path) {
    var p = place(path);
    var need = function () { return ensure(file(p.file, p.own)); };
    return {
      id: p.id, path: path,
      get: function () { return need().then(function () { return docSnap(path, docValue(path), false); }); },
      set: function (data) { return queue(path, 'set', data); },
      update: function (patch) { return queue(path, 'update', patch); },
      delete: function () { return queue(path, 'delete', null); },
      onSnapshot: function (cb, errCb) {
        var l = { path: path, cb: cb, primed: false, sig: null }; docL.push(l);
        need().then(function () {
          if (l.primed) return;
          var d = docValue(path);
          l.primed = true; l.sig = JSON.stringify(d);
          cb(docSnap(path, d, false));
        }).catch(function (e) { if (errCb) errCb(e); });
        return function () { var i = docL.indexOf(l); if (i >= 0) docL.splice(i, 1); };
      }
    };
  }
  function collRef(coll, max) {
    var ref = {
      id: coll, path: coll,
      doc: function (id) { return docRef(coll + '/' + (id || (now().toString(36) + Math.random().toString(36).slice(2, 8)))); },
      add: function (data) {
        var id = now().toString(36) + Math.random().toString(36).slice(2, 8);
        return queue(coll + '/' + id, 'set', data).then(function () { return { id: id, path: coll + '/' + id }; });
      },
      limit: function (n) { return collRef(coll, n); },
      where: function () { return ref; }, orderBy: function () { return ref; },
      get: function () {
        return loadColl(coll).then(function () {
          var s = collSnap(coll, null, false);
          if (max && s.docs.length > max) { s.docs = s.docs.slice(0, max); s.size = s.docs.length; }
          return s;
        });
      },
      onSnapshot: function (cb, errCb) {
        var l = { coll: coll, cb: cb, primed: false, last: {} }; collL.push(l);
        loadColl(coll).then(function () {
          if (l.primed) return;
          var docs = collDocs(coll); Object.keys(docs).forEach(function (p) { l.last[p] = JSON.stringify(docs[p]); });
          l.primed = true; cb(collSnap(coll, null, false));
        }).catch(function (e) { if (errCb) errCb(e); });
        return function () { var i = collL.indexOf(l); if (i >= 0) collL.splice(i, 1); };
      }
    };
    return ref;
  }
  function hasListener(f) {
    return docL.some(function (l) { return place(l.path).file === f.name; }) ||
      collL.some(function (l) { return filesOfColl(l.coll).indexOf(f.name) >= 0; });
  }
  var DB = { doc: docRef, collection: function (c) { return collRef(c); } };

  /* ---------- keeping up with everyone else ---------- */
  var lastActive = now();
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) {
    document.addEventListener(ev, function () { lastActive = now(); }, { capture: true, passive: true });
  });
  function poll(force) {
    if (!ready || !(RS() && RS().token())) return;
    if (PREVIEW && !force) return;          /* nothing changes in the preview copy */
    if (!force && document.visibilityState === 'hidden') return;
    var idle = now() - lastActive > IDLE_AFTER;
    Object.keys(F).forEach(function (k) {
      var f = F[k];
      if (!f.loaded || f.flushing || f.pending.length || f.loading || !hasListener(f)) return;
      var gap = hot(k) ? (idle ? IDLE_POLL_MS : POLL_MS) : COOL_POLL_MS;
      if (!force && now() - (f.polledAt || f.loadedAt) < gap) return;
      f.polledAt = now();
      load(f).catch(function () {});
    });
  }
  setInterval(function () { poll(false); }, 5000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') poll(true); });

  /* ---------- who is signed in ----------
     The page stamps each change with the id it is given and shows the name that id
     resolves to. Here the id carries both, "Name <email>", so every person's name
     shows on the history, not only the viewer's own. */
  function me() { var s = RS() && RS().current(); return { name: (s && s.name) || '', email: (s && s.email) || '' }; }
  function myId() { var m = me(); return m.email ? (m.name ? m.name + ' <' + m.email + '>' : m.email) : ''; }
  var NAMES = {};                /* Claude account ids already in the data -> names (from names.json) */
  function nameOf(id) { id = String(id || ''); var i = id.indexOf(' <'); return i > 0 ? id.slice(0, i) : (NAMES[id] || (id === 'claude' ? 'Claude' : '')); }
  var USER = {
    id: function () { return Promise.resolve(myId()); },
    profiles: function (ids) { var o = {}; (ids || []).forEach(function (id) { o[id] = { name: nameOf(id) }; }); return Promise.resolve(o); },
    can: function () { var rs = RS(); return Promise.resolve(!PREVIEW && !!(rs && rs.canEdit && rs.canEdit(PROJECT))); },
    me: function () { return Promise.resolve(me()); },
    profile: function () { return Promise.resolve(me()); }
  };

  /* ---------- files handed to the person ---------- */
  var DOWNLOADS = {
    save: function (o) {
      return new Promise(function (res) {
        var data = o && o.data, blob = data instanceof Blob ? data : new Blob([data], { type: 'application/octet-stream' });
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (o && o.filename) || 'download';
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); res(); }, 1500);
      });
    }
  };

  /* ---------- the sign-in gate ---------- */
  var ready = false, readyWaiters = [], gateEl = null;
  function whenReady() { return ready ? Promise.resolve() : new Promise(function (r) { readyWaiters.push(r); }); }
  var WHY = {
    UNKNOWN_PROJECT: 'The save relay doesn\u2019t know Marketing HQ yet. It\u2019s being added to the relay\u2019s project list.',
    NO_ACCESS: 'Your account doesn\u2019t have Marketing HQ yet. Ask Jonna Critchley to add you.',
    TOKEN: 'The save relay\u2019s GitHub key was refused. It needs the marketing-hq-data repository added to it.',
    GITHUB: 'GitHub refused the save. The save relay\u2019s GitHub key most likely doesn\u2019t include the marketing-hq-data repository yet.',
    CONFIG_UNAVAILABLE: 'The save relay can\u2019t read its settings right now.',
    OFFLINE: 'Marketing HQ couldn\u2019t reach the save relay. Check your connection.'
  };
  /* The gate sits UNDER the shared sign-in box (session.js draws it at z-index 9500),
     so pressing Sign In shows that box on top rather than behind this card. */
  function gate(kind, e) {
    if (!document.body) { document.addEventListener('DOMContentLoaded', function () { gate(kind, e); }, { once: true }); return; }
    if (!gateEl) {
      var st = document.createElement('style');
      st.textContent = '#hq-gate{position:fixed;inset:0;z-index:9400;display:flex;align-items:center;justify-content:center;padding:16px;' +
        'background:var(--ground,#f1f6fa);font-family:"IBM Plex Sans",system-ui,sans-serif}' +
        '#hq-gate[hidden]{display:none}' +
        '#hq-gate .card{max-width:420px;width:100%;background:var(--surface,#fff);border:1px solid var(--border,#d5e2ed);border-radius:12px;padding:28px 26px;box-shadow:0 8px 28px rgba(13,49,76,.12)}' +
        '#hq-gate .ey{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3,#7794aa);margin-bottom:6px}' +
        '#hq-gate h1{font-size:21px;margin:0 0 10px;color:var(--ink,#0d314c);font-weight:700}' +
        '#hq-gate p{font-size:14px;line-height:1.5;margin:0 0 18px;color:var(--ink-2,#456179)}' +
        '#hq-gate button{font:inherit;font-size:14px;font-weight:600;padding:10px 18px;border-radius:8px;border:1px solid var(--navy,#0d314c);' +
        'background:var(--navy,#0d314c);color:#fff;cursor:pointer}#hq-gate button:hover{filter:brightness(1.12)}';
      document.head.appendChild(st);
      gateEl = document.createElement('div'); gateEl.id = 'hq-gate'; gateEl.setAttribute('role', 'dialog');
      document.body.appendChild(gateEl);
    }
    if (!kind) { gateEl.hidden = true; return; }
    gateEl.hidden = false;
    var h, p, b = null, fn = null;
    /* Signing in and being refused are NOT drawn here: every resources.mismo.org tool uses
       the shared screens from session.js for those. This card only covers the app while it
       waits, loads, or cannot reach its data. 'blank' is the plain backdrop behind the
       shared sign-in window. */
    if (kind === 'blank') { gateEl.innerHTML = ''; return; }
    if (kind === 'loading') { h = 'Opening Marketing HQ\u2026'; p = 'Reading the latest from the private data store.'; }
    else if (kind === 'nosession') { h = 'Marketing HQ Couldn\u2019t Load'; p = 'The resources.mismo.org sign-in didn\u2019t load. Check your connection, then reload the page.'; b = 'Reload'; fn = function () { location.reload(); }; }
    else { h = 'Marketing HQ Couldn\u2019t Reach Its Data'; p = (e && (WHY[e.code] || e.message)) || 'Something went wrong reading the data.'; b = 'Try Again'; fn = function () { start(); }; }
    gateEl.innerHTML = '<div class="card"><div class="ey">Marketing HQ</div><h1></h1><p></p></div>';
    gateEl.querySelector('h1').textContent = h; gateEl.querySelector('p').textContent = p;
    if (b) { var btn = document.createElement('button'); btn.type = 'button'; btn.textContent = b; btn.addEventListener('click', fn); gateEl.querySelector('.card').appendChild(btn); }
  }
  var starting = false;
  function start() {
    var rs = RS();
    if (!rs) { gate('nosession'); return; }
    if (starting) return;
    if (ready && rs.current() && rs.role(PROJECT)) { gate(null); resumeWrites(); return; }
    starting = true; gate('blank');
    /* requireAccess shows the shared sign-in or refusal as needed, and asks the relay
       before refusing, so access granted after signing in is picked up without another
       sign-in. */
    rs.requireAccess(PROJECT, { toolName: TOOL, eyebrow: 'Programs & Operations' }).then(function () {
      if (ready) return;
      gate('loading');
      return ensure(file('editions'));
    }).then(function () {
      ready = true; starting = false; gate(null); resumeWrites();
      readyWaiters.splice(0).forEach(function (r) { r(); });
    }, function (e) {
      starting = false;
      /* The relay refused though the browser's copy said yes: access removed since. */
      if (e && e.code === 'NO_ACCESS') { rs.signIn({ reason: 'no-access', toolName: TOOL, gated: true }).catch(function () {}); return; }
      if (e && e.message === 'cancelled') return;
      gate('error', e);
    });
  }
  function resumeWrites() {
    Object.keys(F).forEach(function (k) { var f = F[k]; if (f.waitingSignIn) { f.waitingSignIn = false; schedule(f, 0); } });
  }
  var askedSignIn = false;
  function needSignIn() {
    if (askedSignIn) return; askedSignIn = true;
    var rs = RS(); if (!rs) return;
    rs.signIn({ reason: 'expired' }).catch(function () {}).then(function () { askedSignIn = false; });
  }
  function hookSession() {
    var rs = RS(); if (!rs) { gate('nosession'); return; }
    rs.onChange(function () { start(); });
    start();
  }

  /* ---------- a quiet line when a save has a problem ---------- */
  var toastEl = null, toastT = null;
  function toast(text, tone) {
    if (!document.body) return;
    if (!toastEl) {
      toastEl = document.createElement('div'); toastEl.id = 'hq-savestate';
      toastEl.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;max-width:min(560px,calc(100vw - 32px));' +
        'padding:10px 16px;border-radius:8px;font:500 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;box-shadow:0 6px 20px rgba(13,49,76,.18)';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = text;
    toastEl.style.background = tone === 'bad' ? '#b3372c' : '#0d314c';
    toastEl.style.color = '#fff'; toastEl.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { toastEl.hidden = true; }, tone === 'bad' ? 9000 : 4000);
  }
  var troubled = false;
  function problem(e, lost) {
    status.lastError = (e && (e.code || e.message)) || 'error';
    if (lost) {
      var why = (e && (WHY[e.code] || e.message)) || 'relay error';
      if (e && e.code === 'GITHUB') why = e.gh === 404
        ? 'GitHub says the save relay\u2019s key can\u2019t see the marketing-hq-data repository. It needs adding to the key\u2019s repository list'
        : 'GitHub refused the save' + (e.gh ? ': ' + e.gh + (e.message ? ' ' + e.message : '') : (e.message ? ': ' + e.message : ''));
      toast('A change didn\u2019t save (' + why + '). It has been taken back.', 'bad'); return;
    }
    troubled = true;
    toast(e && (e.status === 401 || e.code === 'SIGNED_OUT') ? 'Sign in again to finish saving \u2014 nothing is lost.' : 'Not saved yet \u2014 trying again. Keep this tab open.', 'bad');
  }
  function saved() { if (troubled && !anyPending()) { troubled = false; toast('All changes saved.'); } }

  /* ---------- the door ---------- */
  window.claude = {
    use: function (cap) {
      if (cap === 'db') return whenReady().then(function () { return DB; });
      if (cap === 'user') return whenReady().then(function () { return USER; });
      if (cap === 'downloads') return Promise.resolve(DOWNLOADS);
      return Promise.resolve(null);      /* 'sample' (writing the LinkedIn post) and 'assets' (image uploads) wait for the relay */
    }
  };
  /* the notice at the top of the page: preview, or view-only access */
  function banner() {
    var b = document.getElementById('savebanner'); if (!b) return;
    b.innerHTML = PREVIEW
      ? '<b>Preview: Marketing HQ on resources.mismo.org.</b> Nothing here is saved yet. Keep using the Claude version until it\u2019s switched on.'
      : '<b>You have view-only access to Marketing HQ.</b> You can look around; ask Jonna Critchley if you need to make changes.';
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', banner); else banner();
  window.__hqRelay = { files: F, place: place, poll: function () { poll(true); }, pending: anyPending, status: status,
    why: function () { return WHY[status.lastError] || status.lastError || ''; },
    config: { RELAY_URL: RELAY_URL, PROJECT: PROJECT, POLL_MS: POLL_MS } };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', hookSession); else hookSession();
})();
</script>

input[type=file]::file-selector-button{font:inherit;font-weight:600;font-size:12.5px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:5px;padding:6px 12px;margin-right:10px;cursor:pointer}
input[type=file]::file-selector-button:hover{background:var(--surface-3)}
#pp-q{width:min(300px,100%)!important}
/* swimlanes: the next four weeks, one lane per channel */
.lanes{position:relative;padding:8px 16px 14px}
.lanehead{display:grid;grid-template-columns:128px minmax(0,1fr);margin-bottom:4px}
.lanehead .wk{position:relative;height:18px;overflow:hidden}
.lanehead .wk span{position:absolute;top:0;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink-3);transform:translateX(2px);white-space:nowrap}
.lane{display:grid;grid-template-columns:128px minmax(0,1fr);align-items:center;height:38px;border-top:1px solid var(--rule)}
.lane .ln{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.lane .tr{position:relative;height:100%}
.tr .wkend{position:absolute;top:0;bottom:0;background:var(--surface-2)}
.tr .tline{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--sky);border-radius:1px;z-index:2}
.lanes .tlabel{position:absolute;top:-2px;font-size:10px;font-weight:700;color:var(--navy-mid);background:var(--accent-soft);padding:1px 5px;border-radius:3px;transform:translateX(-50%);z-index:3;white-space:nowrap}
.mk{position:absolute;top:50%;transform:translate(-50%,-50%);min-width:18px;height:18px;border-radius:5px;border:0;background:var(--k);color:#fff;font-size:10px;font-weight:700;padding:0 4px;cursor:pointer;z-index:3;box-shadow:0 1px 3px rgba(6,32,47,.25);transition:transform .15s}
.mk:hover,.mk:focus-visible{transform:translate(-50%,-50%) scale(1.35);outline:none;z-index:5}
.mk.done{background:var(--surface);border:2px solid var(--k);color:var(--k)}
.mk.slot{background:transparent;border:2px dashed var(--k);color:var(--k)}
.mk.big{height:24px;min-width:24px;border-radius:6px;box-shadow:0 0 0 4px color-mix(in srgb,var(--k) 25%,transparent)}
.mk.late{animation:mkpulse 1.6s ease-in-out infinite}
@keyframes mkpulse{0%,100%{box-shadow:0 0 0 0 rgba(179,55,44,.55)}50%{box-shadow:0 0 0 7px rgba(179,55,44,0)}}
.mktip{position:fixed;z-index:130;background:var(--navy);color:#fff;font-size:12px;padding:6px 9px;border-radius:5px;pointer-events:none;max-width:280px;box-shadow:0 6px 18px rgba(6,32,47,.3)}
.mktip small{display:block;color:var(--sky-soft);font-size:11px}
@media(max-width:600px){.tiles,.bandsplit .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile .v{font-size:22px}}
@media(max-width:700px){.lanehead .wk em{display:none}.lane,.lanehead{grid-template-columns:70px minmax(0,1fr)}.lane .ln span{display:none}}
/* the edition ring */
.bandsplit .tiles{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.bandsplit{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;align-items:center}
@media(max-width:760px){.bandsplit{grid-template-columns:minmax(0,1fr)}}
.ring{position:relative;width:180px;height:180px;margin:0 auto}
.ring svg{width:100%;height:100%;overflow:visible}
.ring path{transition:opacity .2s;cursor:pointer}
.ring path:hover{opacity:.75}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ring .rc b{font-size:34px;font-weight:700;line-height:1}
.ring .rc span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sky);font-weight:700;margin-top:4px}
.ring .rc small{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px}
.rlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:rgba(255,255,255,.75);margin-top:12px}
.rlegend span{display:inline-flex;align-items:center;gap:6px}
.rlegend i{width:10px;height:10px;border-radius:2px;display:inline-block}
/* on air */
.onair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center;margin-bottom:16px}
@media(max-width:900px){.onair{grid-template-columns:minmax(0,1fr)}}
.onair .lbl{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#fff;background:rgba(235,104,52,.2);border:1px solid rgba(235,104,52,.6);padding:3px 9px;border-radius:4px}
.onair .lbl i{width:8px;height:8px;border-radius:50%;background:#eb6834;animation:air 1.4s ease-in-out infinite}
@keyframes air{50%{opacity:.25}}
.onair .epn{font-size:44px;font-weight:700;line-height:1;margin-top:10px;letter-spacing:-.02em}
.onair .epn small{font-size:16px;color:var(--sky);font-weight:600;margin-left:8px;letter-spacing:0}
.onair .ept{font-size:16px;font-weight:600;margin-top:6px;line-height:1.35}
.onair .epg{font-size:13px;color:rgba(255,255,255,.65);margin-top:3px}
.wave{display:flex;align-items:center;gap:3px;height:86px}
.wave i{flex:1;min-width:2px;border-radius:2px;background:linear-gradient(180deg,var(--sky),#eb6834);height:var(--h);transform-origin:center;animation:wv 1.2s ease-in-out infinite;animation-delay:var(--d);opacity:.9}
@keyframes wv{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.wave.idle i{animation:none;transform:scaleY(.18);opacity:.4}
@media (prefers-reduced-motion:reduce){.wave i,.mk.late,.onair .lbl i{animation:none}.wave i{transform:none}}
/* device toggle for the email preview */
.mailwrap.phone .mail{max-width:390px;border-radius:22px;overflow:hidden;border:10px solid #0d314c}
.mailwrap .mail{transition:max-width .3s}
</style>

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n=>String(n).padStart(2,"0");
const iso = d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const P = s=>{ if(!s||typeof s!=="string") return null; const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; };
const today = ()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; };
const T = ()=>iso(today());
const add = (s,n)=>{ const d=P(s)||today(); d.setDate(d.getDate()+n); return iso(d); };
const diff = (a,b)=>Math.round((P(a)-P(b))/864e5);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOWL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const fS = s=>{ const d=P(s); return d?MON[d.getMonth()]+" "+d.getDate():"—"; };
const fD = s=>{ const d=P(s); return d?DOW[d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate():"—"; };
const fL = s=>{ const d=P(s); return d?DOWL[d.getDay()]+", "+MONL[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear():"—"; };
const fMD = s=>{ const d=P(s); return d?(d.getMonth()+1)+"/"+d.getDate()+"/"+String(d.getFullYear()).slice(2):""; };
const monthName = m=>{ const [y,mm]=m.split("-").map(Number); return MONL[mm-1]+" "+y; };
const thirdWed = (y,m)=>{ const d=new Date(y,m,1); const off=(3-d.getDay()+7)%7; return iso(new Date(y,m,1+off+14)); };
const nextDow = (s,dow)=>{ const d=P(s); const off=(dow-d.getDay()+7)%7; d.setDate(d.getDate()+off); return iso(d); };
const rel = s=>{ if(!s) return ""; const n=diff(s,T()); if(n===0) return "today"; if(n===1) return "tomorrow"; if(n===-1) return "yesterday"; return n>0?("in "+n+" days"):(-n+" days ago"); };
function parseDateIn(v){
  v=String(v||"").trim(); if(!v) return "";
  let m;
  if((m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return iso(new Date(+m[1],+m[2]-1,+m[3]));
  if((m=v.match(/^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?$/))){
    let y = m[3]? +m[3] : today().getFullYear(); if(y<100) y+=2000;
    const d=new Date(y,+m[1]-1,+m[2]); return isNaN(d)?null:iso(d);
  }
  if((m=v.match(/^([A-Za-z]{3,})\.?\s+(\d{1,2})(?:,?\s+(\d{4}))?$/))){
    const mi = MON.findIndex(x=>m[1].toLowerCase().startsWith(x.toLowerCase())); if(mi<0) return null;
    return iso(new Date(m[3]?+m[3]:today().getFullYear(), mi, +m[2]));
  }
  const d=new Date(v); return isNaN(d)?null:iso(d);
}

async function getClaude(){
  for(let i=0;i<40 && !(window.claude && window.claude.use);i++) await new Promise(r=>setTimeout(r,100));
  return (window.claude && window.claude.use) ? window.claude : null;

async function connect(){
  const c = await getClaude();
  try{ DB = c ? await c.use("db") : null; }catch(e){ DB=null; }
  if(!DB){ $("#offline").hidden=false; saveNote(false); schedule(); return; }
  LIVE=true; saveNote(true);
  Object.keys(S).forEach(col=>{
    DB.collection(col).onSnapshot(snap=>{
      const o={}; snap.docs.forEach(d=>{ o[d.id]=Object.assign({id:d.id}, d.data()); });
      S[col]=o; LOADED.add(col); schedule();
    }, err=>{ saveNote(false, err && err.message); });
  });
  try{ ASSETS = await c.use("assets"); }catch(e){ ASSETS=null; }
  try{ SAMPLE = await c.use("sample"); }catch(e){ SAMPLE=null; }
  if(window.__hqRelay){
    let can=true; try{ const u=await c.use("user"); if(u && u.can) can = await u.can(); }catch(e){}

}
let CANWRITE=true, FEED_DONE=false;
/* On resources.mismo.org the home page already keeps a list of every Mic'd Up episode on
   YouTube (/podcast/micdup.json, rebuilt from the channel's feed). Marketing HQ reads it so an
   episode is marked "on YouTube", with its link, the moment it goes up. */
async function syncFeed(){
  if(FEED_DONE || location.hostname!=="resources.mismo.org" || !CANWRITE) return;
  if(!LOADED.has("episodes")){ setTimeout(syncFeed, 1500); return; }
  FEED_DONE=true;
  try{
    const r=await fetch("/podcast/micdup.json",{cache:"no-store"}); if(!r.ok) return;
    const feed=await r.json();
    for(const v of (feed.episodes||[])){
      const m=String(v.title||"").match(/ep(?:isode)?\.?\s*(\d{1,3})/i); if(!m) continue;
      const ep=vals("episodes").find(e=>+e.num===+m[1]); const url="https://www.youtube.com/watch?v="+v.id;
      if(ep && (!ep.youtubeDone || !ep.youtubeUrl)) await patch("episodes",ep.id,{youtubeDone:true, youtubeUrl:ep.youtubeUrl||url});
    }
  }catch(e){}
}
function saveNote(ok, why){
  const n=$("#rail-save"); if(!n) return;
  n.innerHTML = ok ? '<b>Saving</b><span class="ok">Shared with the team · saves as you press Save</span>'
                   : '<b>Saving</b><span class="no">'+esc(why||"Not connected · changes won't be kept")+'</span>';
}
async function put(col,id,data){
  const clean = Object.assign({}, data); delete clean.id;
  clean.updatedAt = new Date().toISOString();
  S[col][id] = Object.assign({id}, clean); schedule();
  if(DB){ try{ await DB.collection(col).doc(id).set(clean); }catch(e){ toast("Couldn't save: "+(e.message||e.code||"try again"), 4000); throw e; } }
}
async function patch(col,id,part){ const cur=S[col][id]||{}; return put(col,id,Object.assign({},cur,part)); }
async function remove(col,id){
  delete S[col][id]; schedule();
  if(DB){ try{ await DB.collection(col).doc(id).delete(); }catch(e){ toast("Couldn't delete: "+(e.message||"try again"),4000); } }
}

function editionsSorted(){ return vals("editions").sort((a,b)=>(a.month<b.month?-1:1)); }
function curEdition(){
  const live = editionsSorted().filter(e=>!e.archived && !(e.done&&e.done.publish));
  return live[0] || editionsSorted().slice(-1)[0] || null;
}
function prevPublish(ed){
  const list=editionsSorted(); const i=list.findIndex(e=>e.id===ed.id);
  const p = i>0 ? list[i-1] : null;
  return p && p.dates && p.dates.publish ? p.dates.publish : add(ed.dates.publish,-35);
}
function edSections(ed){
  const order = (ed.order && ed.order.length) ? ed.order : SECTIONS.map(s=>s.key);
  return order.map(k=>{
    const id = ed.month+"__"+k; const doc = S.sections[id] || {id, month:ed.month, key:k, status:"waiting"};
    const meta = SEC[k] || {key:k, name: doc.name || "One-Off Section", ab:"+", owner:"Kelly", from:""};
    const on = !(ed.excluded && ed.excluded[k]);
    return {id, k, doc, meta, on};
  });
}
function editionFor(dateIso){
  return editionsSorted().find(e=>e.dates && e.dates.publish && dateIso<=e.dates.publish && dateIso>prevPublish(e)) || null;
}
function epsSorted(){ return vals("episodes").sort((a,b)=>(+b.num||0)-(+a.num||0)); }
function epsInWindow(ed){ const a=prevPublish(ed), b=ed.dates.draft||ed.dates.publish; return vals("episodes").filter(e=>e.airDate && e.airDate>a && e.airDate<=ed.dates.publish).sort((x,y)=>(+x.num||0)-(+y.num||0)); }
function newsEdition(n){ if(n.edition) return S.editions[n.edition]||null; return n.date ? editionFor(n.date) : null; }
function newsInWindow(ed){ return vals("news").filter(n=>{ const e=newsEdition(n); return e && e.id===ed.id; }).sort((x,y)=>(x.date||"")<(y.date||"")?1:-1); }
function fridays(from, n){ const out=[]; let d=nextDow(from,5); for(let i=0;i<n;i++){ out.push(d); d=add(d,7); } return out; }
function epOn(fri){ return vals("episodes").find(e=>e.airDate===fri); }
function liDate(ep){ return ep.linkedinDate || (ep.airDate ? add(ep.airDate,3) : ""); }

/* every dated thing, for the calendar, the agenda and the counts */
function allEvents(){
  const ev=[];
  editionsSorted().forEach(ed=>{
    if(ed.archived || !ed.dates) return;
    const nm = MONL[+ed.month.slice(5)-1];
    MILES.forEach(([k,l])=>{ if(ed.dates[k]) ev.push({date:ed.dates[k], k:"matters", label:"Matters · "+(k==="publish"?nm+" Edition Goes Out":l), done:!!(ed.done&&ed.done[k]), big:k==="publish", who:k==="review"||k==="approve"?"Amy":k==="content"||k==="draft"?"Kelly":"Vanessa", go:()=>{ go("matters"); MS.ed=ed.id; renderMatters(); }}); });
  });
  vals("episodes").forEach(ep=>{
    if(!ep.airDate) return;
    ev.push({date:ep.airDate, k:"micdup", label:"Mic'd Up Ep "+(ep.num||"?")+" · YouTube", done:!!ep.youtubeDone, who:"Vanessa", go:()=>openEpisode(ep.id)});
    const l=liDate(ep); if(l) ev.push({date:l, k:"linkedin", label:"LinkedIn · Mic'd Up Ep "+(ep.num||"?"), done:!!ep.linkedinDone, who:"Vanessa", go:()=>openEpisode(ep.id)});
  });
  fridays(MICDUP_START, 60).forEach(f=>{ if(!epOn(f) && f>=add(T(),-14) && f<=add(T(),120)) ev.push({date:f, k:"micdup", label:"Mic'd Up · Episode Needed", done:false, slot:true, who:"Brian", go:()=>newEpisode(f)}); });
  vals("pieces").forEach(p=>{ if(p.date) ev.push({date:p.date, k:p.channel||"other", label:(p.channel==="setup"?"Setup · ":CH[p.channel]?CH[p.channel]+" · ":"")+(p.title||"Untitled"), done:p.status==="done"||!!p.done, who:p.owner||"", go:()=>openPiece(p.id)}); });
  SUMMITS.forEach(s=>{ let d=s.start; while(d<=s.end){ ev.push({date:d, k:"summit", label:s.name, done:false, big:true, who:"", go:()=>{ go("summits"); SM.id=s.id; renderSummits(); }}); d=add(d,1);} });
  return ev;
}

function closePane(force){

const CAL_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
function buildFields(fields, d){
  let h='', open=false;
  const close=()=>{ if(open){ h+='</div>'; open=false; } };
  (fields||[]).forEach(f=>{
    if(f.sec){ close(); h+='<div class="fsec">'+esc(f.sec)+'</div>'; return; }
    if(!open){ h+='<div class="fgrid">'; open=true; }
    const id="f-"+f.k, v = f.get? f.get(d) : d[f.k];
    const cls = 'field'+(f.wide||f.type==="textarea"||f.type==="checks"||f.type==="html"?" wide":"");
    h+='<div class="'+cls+'">';
    if(f.label && f.type!=="cb") h+='<label for="'+id+'">'+esc(f.label)+'</label>';
    if(f.type==="textarea") h+='<textarea id="'+id+'" rows="'+(f.rows||4)+'" placeholder="'+esc(f.ph||"")+'">'+esc(v||"")+'</textarea>';
    else if(f.type==="select") h+='<select id="'+id+'">'+(f.blank?'<option value=""></option>':'')+f.opts.map(o=>{ const [ov,ol]=Array.isArray(o)?o:[o,o]; return '<option value="'+esc(ov)+'"'+(String(v||"")===String(ov)?" selected":"")+'>'+esc(ol)+'</option>'; }).join("")+'</select>';
    else if(f.type==="date") h+='<div class="datef"><input type="text" id="'+id+'" value="'+esc(fMD(v))+'" placeholder="e.g. 11/18/26" autocomplete="off"><button class="btn calb" type="button" data-cal="'+id+'" aria-label="Pick from a calendar" title="Pick from a calendar">'+CAL_SVG+'</button><input type="date" tabindex="-1" aria-hidden="true" data-for="'+id+'" value="'+esc(v||"")+'"></div>';
    else if(f.type==="checks") h+='<div class="cbs" id="'+id+'">'+f.opts.map(([ov,ol])=>'<label><input type="checkbox" value="'+esc(ov)+'"'+(v&&v[ov]?" checked":"")+'> '+esc(ol)+'</label>').join("")+'</div>';
    else if(f.type==="cb") h+='<div class="cbs"><label><input type="checkbox" id="'+id+'"'+(v?" checked":"")+'> '+esc(f.label)+'</label></div>';
    else if(f.type==="ro") h+='<div class="ro" id="'+id+'">'+esc(v||"—")+'</div>';
    else if(f.type==="html") h+='<div id="'+id+'">'+(f.html? f.html(d):"")+'</div>';
    else h+='<input type="'+(f.type==="number"?"number":f.type==="url"?"url":"text")+'" id="'+id+'" value="'+esc(v==null?"":v)+'" placeholder="'+esc(f.ph||"")+'" autocomplete="off">';
    if(f.hint) h+='<span class="hint">'+esc(f.hint)+'</span>';
    h+='</div>';
  });
  close(); return h;
}
function wireFields(root){
  $$("[data-cal]",root).forEach(b=>{
    const id=b.dataset.cal, txt=$("#"+id,root), di=root.querySelector('input[data-for="'+id+'"]');
    b.onclick=()=>{ const cur=parseDateIn(txt.value); if(cur) di.value=cur; try{ di.showPicker(); }catch(e){ di.style.pointerEvents="auto"; di.focus(); di.click(); } };
    di.onchange=()=>{ txt.value=fMD(di.value); if(PANE) PANE.dirty=true; };
    txt.onblur=()=>{ const p=parseDateIn(txt.value); if(p) txt.value=fMD(p); };
  });
}
function readFields(fields){
  const out={}; let bad=null;
  (fields||[]).forEach(f=>{
    if(!f.k || f.type==="ro" || f.type==="html" || f.sec) return;
    const el=$("#f-"+f.k); if(!el) return;
    if(f.type==="checks"){ const o={}; $$("input",el).forEach(i=>{ if(i.checked) o[i.value]=true; }); out[f.k]=o; }
    else if(f.type==="cb") out[f.k]=el.checked;
    else if(f.type==="date"){ const p=parseDateIn(el.value); if(p===null){ bad=bad||f.label; el.focus(); } else out[f.k]=p; }
    else if(f.type==="number") out[f.k]= el.value===""?"":Number(el.value);
    else out[f.k]=el.value.trim();
  });
  if(bad){ const m=$("#pf-msg"); if(m) m.textContent="\""+bad+"\" isn't a date I can read. Try 11/18/26."; return null; }
  if(PANE && PANE.set){ PANE.set(out); }
  return out;
}

function buildText(ed){

/* reading a spreadsheet or CSV someone drops in (SheetJS, loaded from cdnjs) */
function readSheet(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ try{
      if(!window.XLSX) throw new Error("The spreadsheet reader didn't load. Check your connection and reload the page.");
      const wb=XLSX.read(new Uint8Array(fr.result),{type:"array",cellDates:true});
      let best=[]; wb.SheetNames.forEach(n=>{ const raw=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:"",raw:false});
        let h=raw.findIndex(r=>r.filter(c=>String(c).trim()).length>=2 && r.some(c=>/mail|title|views|impressions|video|content|subject|post/i.test(String(c)))); if(h<0) h=0;
        const head=raw[h].map(c=>String(c).trim()); const rows=raw.slice(h+1).filter(r=>r.some(c=>String(c).trim())).map(r=>Object.fromEntries(head.map((k,i)=>[k,r[i]])));
        if(rows.length>best.length) best=rows; });
      res(best);
    }catch(e){ rej(e); } };
    fr.onerror=()=>rej(new Error("Couldn't read that file.")); fr.readAsArrayBuffer(file);
  });
}

/* ================= rail (Summit HQ, verbatim except gather) ================= */
(function(){
  const KEY='hq.rail.off';
  function set(off, remember){
    document.body.classList.toggle('railmini', !!off);
    const h=document.getElementById('rail-hide');
    if(h){ h.setAttribute('aria-expanded', off?'false':'true'); h.setAttribute('aria-label', off?'Open the menu':'Narrow the menu'); h.title = (off?'Open the menu':'Narrow the menu')+' (backslash)'; }
    if(off) close();
    if(remember!==false){ try{ localStorage.setItem(KEY, off?'1':'0'); }catch(e){} }
    setTimeout(()=>{ window.dispatchEvent(new Event('resize')); }, 230);
  }
  function toggle(){ set(!document.body.classList.contains('railmini')); }
  function start(){
    let off=null;
    try{ const v=localStorage.getItem(KEY); if(v!==null) off=(v==='1'); }catch(e){}
    if(off===null) off = window.matchMedia('(max-width:900px)').matches;
    set(off, false);
    const h=document.getElementById('rail-hide'); if(h) h.addEventListener('click',toggle);
    const sc=document.getElementById('rail-scrim'); if(sc) sc.addEventListener('click',()=>set(true));
    const qb=document.getElementById('rail-qb');
    if(qb) qb.addEventListener('click',()=>{ set(false); setTimeout(()=>{ const q=document.getElementById('rail-q'); if(q) q.focus(); },230); });
    document.querySelectorAll('.hq nav button[data-hq]').forEach(b=>{
      b.addEventListener('click',()=>{ show(b.dataset.hq); if(window.matchMedia('(max-width:900px)').matches) set(true); });
    });
    wireFind();
  }
  document.addEventListener('keydown',e=>{
    const t=e.target; const typing = t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
    if(e.key==='Escape' && PANE && !typing){ closePane(); return; }
    if(e.key==='\\' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); toggle(); }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); set(false); setTimeout(()=>{ const q=document.getElementById('rail-q'); if(q){ q.focus(); q.select(); } }, 230); }
  });
  const HITS=()=>document.getElementById('rail-hits');
  let picked=-1, rows=[];
  function norm(x){ return String(x||'').replace(/\s+/g,' ').trim().toLowerCase(); }
  function gather(q){
    const t=norm(q); if(t.length<2) return [];
    const out=[];
    const score=(name)=>{ const n=norm(name); return n===t ? 3 : n.indexOf(t)===0 ? 2 : n.indexOf(t)>=0 ? 1 : 0; };
    const push=(group,name,where,go_,hay)=>{ if(out.length<60) out.push({group,name,where,go:go_,s:Math.max(score(name), hay&&norm(hay).indexOf(t)>=0?1:0)}); };
    try{ editionsSorted().forEach(ed=>{ edSections(ed).forEach(s=>{ const nm=(s.doc.headline||s.doc.name||s.meta.name); const hay=[s.meta.name,s.doc.headline,s.doc.body,s.doc.quoteBy].join(" "); if(norm(hay).indexOf(t)<0) return; push('MISMO Matters', nm, s.meta.name+' · '+monthName(ed.month), ()=>{ go('matters'); MS.ed=ed.id; MS.sub="sections"; renderMatters(); if(!ed.archived) openSection(ed,s.k); }, hay); }); }); }catch(e){}
    try{ vals("episodes").forEach(e=>{ const hay=["Episode "+e.num,e.title,e.guests,e.company].join(" "); if(norm(hay).indexOf(t)<0) return; push("Mic'd Up", "Ep "+(e.num||"?")+": "+(e.title||""), [e.guests,e.company].filter(Boolean).join(", "), ()=>{ go('micdup'); openEpisode(e.id); }, hay); }); }catch(e){}
    try{ vals("pieces").forEach(p=>{ const hay=[p.title,p.copy,p.notes,p.kind].join(" "); if(norm(hay).indexOf(t)<0) return; push(CH[p.channel]||"Items", p.title||"Untitled", fS(p.date)+(p.owner?" · "+p.owner:""), ()=>{ const tab={linkedin:"linkedin",youtube:"youtube",mailchimp:"mailchimp",summit:"summits"}[p.channel]||"overview"; go(tab); openPiece(p.id); }, hay); }); }catch(e){}
    try{ vals("news").forEach(n=>{ const hay=[n.headline,n.outlet].join(" "); if(norm(hay).indexOf(t)<0) return; push("In the News", n.headline||"", (n.outlet||"")+" · "+fS(n.date), ()=>{ go('news'); openNews(n.id); }, hay); }); }catch(e){}
    const best={}; out.forEach(h=>{ best[h.group]=Math.max(best[h.group]||0, h.s); });
    const ORDER=['MISMO Matters',"Mic'd Up",'LinkedIn','YouTube','Mailchimp','Summits','In the News','Setup'];
    out.sort((a,b)=>(best[b.group]-best[a.group])||(ORDER.indexOf(a.group)-ORDER.indexOf(b.group))||(b.s-a.s)||String(a.name).localeCompare(String(b.name)));
    return out;
  }
  function draw(list){
    const box=HITS(); if(!box) return; box.textContent=''; rows=[]; picked=-1;
    if(!list.length){ const n=document.createElement('div'); n.className='rh-none'; n.textContent='Nothing matches.'; box.appendChild(n); box.hidden=false; return; }
    let g=null;
    list.slice(0,24).forEach(h=>{
      if(h.group!==g){ g=h.group; const hd=document.createElement('div'); hd.className='rh-g'; hd.textContent=g; box.appendChild(hd); }
      const b=document.createElement('button'); b.type='button'; b.className='rh';
      const nm=document.createElement('b'); nm.textContent=h.name; b.appendChild(nm);
      if(h.where){ const w=document.createElement('i'); w.textContent=h.where; b.appendChild(w); }
      b.addEventListener('click',()=>{ close(); h.go(); }); rows.push(b); box.appendChild(b);
    });
    box.hidden=false;
  }
  function close(){ const b=HITS(); if(b){ b.hidden=true; b.textContent=''; } rows=[]; picked=-1; }
  function mark(){ rows.forEach((r,i)=>r.classList.toggle('on', i===picked)); if(rows[picked]) try{ rows[picked].scrollIntoView({block:'nearest'}); }catch(e){} }
  function wireFind(){
    const q=document.getElementById('rail-q'), x=document.getElementById('rail-qx'); if(!q) return;
    let tmr=null;
    const run=()=>{ const v=q.value; if(x) x.hidden = !v; if(norm(v).length<2){ close(); return; } draw(gather(v)); };
    q.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(run,150); });
    q.addEventListener('focus',()=>{ if(norm(q.value).length>=2) run(); });
    q.addEventListener('keydown',e=>{
      if(e.key==='Escape'){ close(); q.blur(); return; }
      if(!rows.length) return;
      if(e.key==='ArrowDown'){ e.preventDefault(); picked=(picked+1)%rows.length; mark(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); picked=(picked-1+rows.length)%rows.length; mark(); }
      else if(e.key==='Enter'){ e.preventDefault(); (rows[picked]||rows[0]).click(); }
    });
    if(x) x.addEventListener('click',()=>{ q.value=''; x.hidden=true; close(); q.focus(); });
    document.addEventListener('click',e=>{ if(!e.target.closest('.railfind')) close(); });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
  window.__rail={ show:()=>set(false), hide:()=>set(true), toggle, mini:()=>document.body.classList.contains('railmini') };
})();

(function theme(){
  var btn = document.getElementById("theme-btn"); if(!btn) return;
  function cur(){ var t = document.documentElement.getAttribute("data-theme"); if(t) return t; return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
  function paint(){ const dark = cur() === "dark"; const lab = document.getElementById("theme-lab"); if(lab) lab.textContent = dark ? "Light Mode" : "Dark Mode"; else btn.textContent = dark ? "Light Mode" : "Dark Mode"; btn.title = "Switch to " + (dark ? "light" : "dark") + " mode"; }
  btn.addEventListener("click", function(){ document.documentElement.setAttribute("data-theme", cur() === "dark" ? "light" : "dark"); paint(); try{ localStorage.setItem("mismo.portal.theme", cur()); }catch(e){} window.dispatchEvent(new Event("resize")); });
  try{ var saved = localStorage.getItem("mismo.portal.theme"); if(saved) document.documentElement.setAttribute("data-theme", saved); }catch(e){}
  paint();
})();
