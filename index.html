<!doctype html>
<!--
  MISMO Media (formerly Marketing HQ), resources.mismo.org/marketing-hq/
  BEFORE UPLOADING A NEW COPY OF THIS FILE: download the current index.html from GitHub first
  and make your changes to that copy. Uploading an older copy silently undoes everything that
  changed since.
  Built the same way as Member 360, Summit HQ and the IIF Planning HQ: the shared resources.mismo.org
  sign-in (/assets/session.js) and the one door to the save relay (project key "marketing-hq", data
  in the PRIVATE repository GitMISMO/marketing-hq-data). No GitHub token or other secret ever goes
  in this file, and no records either: they all arrive from marketing-hq-data after sign-in.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MISMO Media</title>
<!-- Hide the app until someone is signed in. If this file is replaced by an upload, carry this block across. -->
<style>html.hq-out body > *:not(#hq-gate):not(.rs-scrim){visibility:hidden}</style>
<script>(function(){
  var out = true;
  try {
    var s = JSON.parse(localStorage.getItem('resources:session') || 'null');
    out = !(s && s.token && s.expiresAt && Date.parse(s.expiresAt) > Date.now());
  } catch (e) { out = true; }
  document.documentElement.classList.add(out ? 'hq-out' : 'hq-in');
})();</script>
<script src="/assets/session.js"></script>
<script>(function(){
  function sync(){
    var rs = window.ResourcesSession, inn = !!(rs && rs.current());
    document.documentElement.classList.toggle('hq-out', !inn);
    document.documentElement.classList.toggle('hq-in', inn);
  }
  if (window.ResourcesSession) { window.ResourcesSession.onChange(sync); sync(); }
  else { document.addEventListener('DOMContentLoaded', function(){
    if (window.ResourcesSession) { window.ResourcesSession.onChange(sync); sync(); }
    else document.documentElement.classList.remove('hq-out');   // module missing: do not lock the page
  }); }
})();</script>
<script>
/* ============================================================================
   MARKETING HQ ON resources.mismo.org - the one door to MISMO's save relay
   ----------------------------------------------------------------------------
   Built the same way as Member 360's, Summit HQ's and the IIF Planning HQ's doors.
   MISMO Media was built inside Claude, where it reached its records through
   window.claude.use('db'). This gives the page that same door, backed by the save
   relay instead, so none of the tabs change.

   Where the data lives: the PRIVATE repository GitMISMO/marketing-hq-data, reached
   only through the relay under the project key "marketing-hq". This PUBLIC page
   holds no records at all: editions, episodes, posts, news, lists and the
   subscriber and downloader lists all arrive after sign-in.

   How documents are filed (the relay has no "list a folder" route):
     editions, sections, episodes, pieces, news, lists
                         one file per collection: {docs:{"<collection>/<id>": {...}}}
     audience-...        the subscriber and downloader lists, one file per part:
                         {doc:{...}}, listed in own-index so the collection can be read

   PREVIEW: while PREVIEW is true, the page opens for everyone with access but saves
   nothing, and says so. Switching on = set PREVIEW to false, after Claude re-copies
   the latest records from the Claude version into marketing-hq-data.

   Saving: every save sends the version (sha) it last read. If someone else saved
   in between, the relay answers 409; the change is re-applied on top of theirs and
   sent again. Other people's changes are re-read every minute while the page is open.

   Sign-in is the shared resources.mismo.org sign-in (/assets/session.js). Who may
   open it, and who may save, is set per person in People & Access.
   ========================================================================== */
(function () {
  'use strict';
  if (window.__hqRelay) return;

  var RELAY_URL = 'https://rgvdi67cg27o5kcmiytcqbqnrm0hmztx.lambda-url.us-east-1.on.aws';
  var PROJECT = 'marketing-hq', TOOL = 'MISMO Media';
  var PREVIEW = false;          /* see the header: false once MISMO Media is switched on */
  var POLL_MS = 60000, IDLE_POLL_MS = 180000, IDLE_AFTER = 10 * 60000, COOL_POLL_MS = 1800000;
  /* collections whose documents each get a file of their own (the big synced ones) */
  var OWN = ['audience'];
  function hot(name) { return !/^audience-|^own-index$/.test(name); }
  var FLUSH_MS = 350, RETRY_MS = 8000;
  var MAX_FILE = 940000;        /* the relay takes at most 1,000,000 bytes a save */

  /* ---------- browser storage: every tool shares this web address ----------
     This page's own keys (the remembered menu width and the like) are filed under
     tools:marketing-hq: so they cannot collide with another tool's. The sign-in and the
     MISMO theme are shared on purpose and are left alone. */
  (function () {
    var P = 'tools:marketing-hq:';
    var shared = function (k) { k = String(k); return k.indexOf('tools:') === 0 || k.indexOf('resources:') === 0 || k === 'mismo.portal.theme'; };
    try {
      var S = Storage.prototype, g = S.getItem, s = S.setItem, r = S.removeItem;
      S.getItem = function (k) { return g.call(this, shared(k) ? k : P + k); };
      S.setItem = function (k, v) { return s.call(this, shared(k) ? k : P + k, v); };
      S.removeItem = function (k) { return r.call(this, shared(k) ? k : P + k); };
    } catch (e) {}
  })();

  function RS() { return window.ResourcesSession || null; }
  function clone(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
  function safe(s) { return String(s).toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/-{3,}/g, '--').replace(/^-+|-+$/g, '') || 'x'; }
  function err(code, message, status) { var e = new Error(message || code); e.code = code; e.status = status || 0; return e; }
  function now() { return Date.now(); }

  /* ---------- where a document is filed ---------- */
  function place(path) {
    var seg = String(path).split('/');
    if (seg.length !== 2) throw err('invalid_argument', 'Not a document path: ' + path);
    if (OWN.indexOf(seg[0]) >= 0) return { file: safe(seg[0] + '-' + seg[1]).slice(0, 40), own: true, coll: seg[0], id: seg[1] };
    return { file: safe(seg[0]).slice(0, 40), coll: seg[0], id: seg[1] };
  }
  function parentOf(path) { var s = String(path).split('/'); return s.slice(0, -1).join('/'); }
  function idOf(path) { var s = String(path).split('/'); return s[s.length - 1]; }

  /* ---------- talking to the relay ---------- */
  var status = { offline: false, lastError: '' };
  function net(method, name, body) {
    var rs = RS(), tok = rs && rs.token();
    if (!tok) return Promise.reject(err('SIGNED_OUT', 'Not signed in', 401));
    var headers = { 'Authorization': 'Bearer ' + tok };
    if (body) headers['Content-Type'] = 'application/json';
    return fetch(RELAY_URL + '/' + PROJECT + '/data/' + encodeURIComponent(name), {
      method: method, cache: 'no-store', headers: headers, body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      status.offline = false;
      return r.json().catch(function () { return {}; }).then(function (b) {
        if (r.ok) return b;
        var e = err((b && b.error) || ('HTTP_' + r.status), b && b.message, r.status);
        e.gh = (b && typeof b.status === 'number') ? b.status : 0;   /* what GitHub itself answered */
        if (r.status === 401 && rs) { needSignIn(); }
        throw e;
      });
    }, function () { status.offline = true; throw err('OFFLINE', 'Could not reach the relay', 0); });
  }

  /* ---------- files ---------- */
  var F = {};
  function file(name, own) {
    if (!F[name]) F[name] = { name: name, own: !!own, server: null, sha: null, loaded: false, loading: null,
      loadedAt: 0, pending: [], timer: null, flushing: false, view: null, waitingSignIn: false };
    return F[name];
  }
  function normalise(f, c) {
    c = c && typeof c === 'object' ? c : {};
    if (f.own) return { doc: c.doc === undefined ? null : c.doc };
    return { docs: c.docs && typeof c.docs === 'object' ? c.docs : {} };
  }
  function load(f) {
    if (f.loading) return f.loading;
    f.loading = net('GET', f.name).then(function (b) {
      return { content: normalise(f, b && b.data), sha: (b && b.sha) || null };
    }, function (e) {
      /* the relay answers a missing file with {data:null}; a 404 means something else is
         wrong (most often UNKNOWN_PROJECT) and must not be mistaken for an empty file */
      if (e && e.status === 404 && (e.code === 'NOT_FOUND' || e.code === 'HTTP_404')) return { content: normalise(f, null), sha: null };
      throw e;
    }).then(function (got) {
      var before = f.loaded ? JSON.stringify(f.server) : null;
      f.server = got.content; f.sha = got.sha; f.loaded = true; f.loadedAt = now(); f.view = null;
      f.loading = null;
      if (before !== JSON.stringify(f.server)) notify(f, false);
      return f;
    }, function (e) { f.loading = null; throw e; });
    return f.loading;
  }
  function ensure(f) { return f.loaded ? Promise.resolve(f) : load(f); }

  function applyOps(f, content, ops) {
    ops.forEach(function (op) {
      if (f.own) {
        if (op.kind === 'set') content.doc = clone(op.data);
        else if (op.kind === 'update') content.doc = Object.assign({}, content.doc || {}, clone(op.data));
        else if (op.kind === 'delete') content.doc = null;
        return;
      }
      if (op.kind === 'set') content.docs[op.path] = clone(op.data);
      else if (op.kind === 'update') content.docs[op.path] = Object.assign({}, content.docs[op.path] || {}, clone(op.data));
      else if (op.kind === 'delete') delete content.docs[op.path];
    });
    return content;
  }
  function viewOf(f) {
    if (!f.loaded) return null;
    if (!f.view) f.view = applyOps(f, clone(f.server), f.pending);
    return f.view;
  }
  function docIn(f, path) {
    var v = viewOf(f); if (!v) return undefined;
    var d = f.own ? v.doc : v.docs[path];
    return d === undefined ? null : d;
  }

  /* ---------- saving ---------- */
  function queue(path, kind, data) {
    if (PREVIEW) {
      if (now() - previewWarned > 4000) { previewWarned = now(); toast('This is the preview of MISMO Media on resources.mismo.org \u2014 nothing here is saved. Keep using the Claude version until it\u2019s switched on.', 'bad'); }
      return Promise.reject(err('invalid_argument', 'Preview: not saved'));
    }
    var p = place(path), f = file(p.file, p.own);
    return new Promise(function (res, rej) {
      var go = function () {
        if (kind === 'update' && f.loaded && docIn(f, path) === null) { rej(err('not-found', 'No document to update: ' + path)); return; }
        f.pending.push({ kind: kind, path: path, data: data, res: res, rej: rej }); f.view = null;
        if (p.own) register(path, kind !== 'delete');
        notify(f, true);
        schedule(f, FLUSH_MS);
      };
      if (kind === 'update' && !f.loaded) ensure(f).then(go, function (e) { rej(e); });
      else { if (!f.loaded) ensure(f).catch(function () {}); go(); }
    });
  }
  var previewWarned = 0;
  /* files that hold one document each are listed in own-index, so a collection can be read back */
  function register(path, present) {
    var r = file('own-index');
    var known = r.loaded ? !!(viewOf(r).docs[path]) : null;
    if (known === present) return;
    r.pending.push({ kind: present ? 'set' : 'delete', path: path, data: present ? { file: place(path).file } : null,
      res: function () {}, rej: function () {} });
    r.view = null;
    if (!r.loaded) ensure(r).catch(function () {}); else notify(r, true);
    schedule(r, FLUSH_MS);
  }
  function schedule(f, ms) {
    if (f.timer) return;
    f.timer = setTimeout(function () { f.timer = null; flush(f); }, ms);
  }
  /* GitHub makes one commit to a branch at a time, so every save goes out after the
     one before it has finished, never side by side. */
  var putChain = Promise.resolve();
  function put(name, body) {
    var go = function () { return net('PUT', name, body); };
    var p = putChain.then(go, go);
    putChain = p.then(function () {}, function () {});
    return p;
  }
  function flush(f) {
    if (f.flushing || !f.pending.length) return;
    if (!(RS() && RS().token())) { f.waitingSignIn = true; needSignIn(); return; }
    f.flushing = true;
    var batch = f.pending.slice(), tries = 0;
    var attempt = function () {
      return ensure(f).then(function () {
        var next = applyOps(f, clone(f.server), batch);
        /* the relay saves files pretty-printed and can only read back a file under 1 MB, so the pretty size is what counts */
        if (JSON.stringify(next, null, 2).length > MAX_FILE) throw err('TOO_BIG', 'This part of MISMO Media has grown too big to save in one piece.');
        return put(f.name, { content: next, sha: f.sha }).then(function (b) {
          f.server = next; f.sha = (b && b.sha) || f.sha; f.loadedAt = now();
          f.pending = f.pending.filter(function (op) { return batch.indexOf(op) < 0; }); f.view = null;
          batch.forEach(function (op) { op.res(); });
          notify(f, false);
          saved();
        });
      }).catch(function (e) {
        if (e && e.status === 409 && tries < 8) {
          tries++;
          f.loaded = false;
          return new Promise(function (r) { setTimeout(r, 300 * tries + Math.random() * 500); })
            .then(function () { return load(f); }).then(attempt);
        }
        throw e;
      });
    };
    attempt().catch(function (e) {
      /* a 502 from the relay with TOKEN or GITHUB is a setup problem, not a blip: say so at
         once rather than retrying quietly forever */
      var transient = e && (e.code === 'OFFLINE' || e.status === 401 || e.code === 'SIGNED_OUT' ||
        (e.status >= 500 && e.code !== 'TOKEN' && e.code !== 'GITHUB' && e.code !== 'REJECTED') ||
        (e.code === 'GITHUB' && (e.gh >= 500 || !e.gh && /timed? ?out|ETIMEDOUT|ECONNRESET|fetch failed/i.test(e.message || ''))));
      if (transient) {
        /* nothing is lost: the change stays queued and goes out once the relay is back */
        if (e.status === 401 || e.code === 'SIGNED_OUT') f.waitingSignIn = true;
        else setTimeout(function () { schedule(f, 0); }, RETRY_MS);
        problem(e);
        return;
      }
      f.pending = f.pending.filter(function (op) { return batch.indexOf(op) < 0; }); f.view = null;
      batch.forEach(function (op) { op.rej(e); });
      notify(f, false);
      problem(e, true);
    }).then(function () {
      f.flushing = false;
      if (f.pending.length && !f.waitingSignIn) schedule(f, FLUSH_MS);
    });
  }
  function anyPending() { return Object.keys(F).some(function (k) { return F[k].pending.length; }); }
  window.addEventListener('beforeunload', function (e) {
    if (anyPending()) { e.preventDefault(); e.returnValue = 'MISMO Media is still saving.'; return e.returnValue; }
  });

  /* ---------- snapshots and listeners ---------- */
  function docSnap(path, data, pending) {
    var exists = data !== null && data !== undefined;
    return { id: idOf(path), exists: exists, ref: { id: idOf(path), path: path },
      data: function () { return exists ? clone(data) : undefined; },
      metadata: { hasPendingWrites: !!pending, fromCache: false } };
  }
  var docL = [], collL = [];
  function docValue(path) {
    var p = place(path);
    return docIn(file(p.file, p.own), path);
  }
  function isOwn(coll) { return OWN.indexOf(coll) >= 0; }
  function ownPaths(coll) {
    var r = viewOf(file('own-index')); if (!r) return [];
    return Object.keys(r.docs).filter(function (p) { return parentOf(p) === coll; });
  }
  function collDocs(coll) {
    var out = {};
    if (isOwn(coll)) {
      ownPaths(coll).forEach(function (p) { var f = F[place(p).file]; if (f && f.loaded) { var d = docIn(f, p); if (d !== null) out[p] = d; } });
      return out;
    }
    var v = viewOf(file(place(coll + '/x').file));
    if (v) Object.keys(v.docs).forEach(function (p) { if (parentOf(p) === coll) out[p] = v.docs[p]; });
    return out;
  }
  /* the files a collection's listeners depend on */
  function filesOfColl(coll) {
    if (!isOwn(coll)) return [place(coll + '/x').file];
    return ['own-index'].concat(ownPaths(coll).map(function (p) { return place(p).file; }));
  }
  function loadColl(coll) {
    if (!isOwn(coll)) return ensure(file(place(coll + '/x').file));
    return ensure(file('own-index')).then(function () {
      return Promise.all(ownPaths(coll).map(function (p) { return ensure(file(place(p).file, true)); }));
    });
  }
  function collSnap(coll, changes, pending) {
    var docs = collDocs(coll), list = Object.keys(docs).map(function (p) { return docSnap(p, docs[p], pending); });
    return { docs: list, size: list.length, empty: !list.length,
      forEach: function (fn) { list.forEach(fn); },
      docChanges: function () { return changes || list.map(function (d) { return { type: 'added', doc: d }; }); },
      metadata: { hasPendingWrites: !!pending, fromCache: false } };
  }
  function notify(f, pending) {
    if (f.name === 'own-index') collL.forEach(function (l) {   /* a new own document: load it */
      if (isOwn(l.coll)) ownPaths(l.coll).forEach(function (p) { var of = file(place(p).file, true); if (!of.loaded && !of.loading) ensure(of).catch(function () {}); });
    });
    docL.forEach(function (l) {
      if (place(l.path).file !== f.name || !f.loaded) return;
      var d = docValue(l.path), sig = JSON.stringify(d);
      if (l.primed && sig === l.sig) return;
      l.primed = true; l.sig = sig;
      try { l.cb(docSnap(l.path, d, pending)); } catch (e) { console.error(e); }
    });
    collL.forEach(function (l) {
      var files = filesOfColl(l.coll);
      if (files.indexOf(f.name) < 0) return;
      if (!files.every(function (n) { return file(n).loaded; })) return;
      var docs = collDocs(l.coll), changes = [], seen = {};
      Object.keys(docs).forEach(function (p) {
        var sig = JSON.stringify(docs[p]); seen[p] = 1;
        if (!(p in l.last)) changes.push({ type: 'added', doc: docSnap(p, docs[p], pending) });
        else if (l.last[p] !== sig) changes.push({ type: 'modified', doc: docSnap(p, docs[p], pending) });
        l.last[p] = sig;
      });
      Object.keys(l.last).forEach(function (p) {
        if (!seen[p]) { changes.push({ type: 'removed', doc: docSnap(p, null, pending) }); delete l.last[p]; }
      });
      if (l.primed && !changes.length) return;
      l.primed = true;
      try { l.cb(collSnap(l.coll, changes, pending)); } catch (e) { console.error(e); }
    });
  }

  /* ---------- the store, in the shape the tabs already use ---------- */
  function docRef(path) {
    var p = place(path);
    var need = function () { return ensure(file(p.file, p.own)); };
    return {
      id: p.id, path: path,
      get: function () { return need().then(function () { return docSnap(path, docValue(path), false); }); },
      set: function (data) { return queue(path, 'set', data); },
      update: function (patch) { return queue(path, 'update', patch); },
      delete: function () { return queue(path, 'delete', null); },
      onSnapshot: function (cb, errCb) {
        var l = { path: path, cb: cb, primed: false, sig: null }; docL.push(l);
        need().then(function () {
          if (l.primed) return;
          var d = docValue(path);
          l.primed = true; l.sig = JSON.stringify(d);
          cb(docSnap(path, d, false));
        }).catch(function (e) { if (errCb) errCb(e); });
        return function () { var i = docL.indexOf(l); if (i >= 0) docL.splice(i, 1); };
      }
    };
  }
  function collRef(coll, max) {
    var ref = {
      id: coll, path: coll,
      doc: function (id) { return docRef(coll + '/' + (id || (now().toString(36) + Math.random().toString(36).slice(2, 8)))); },
      add: function (data) {
        var id = now().toString(36) + Math.random().toString(36).slice(2, 8);
        return queue(coll + '/' + id, 'set', data).then(function () { return { id: id, path: coll + '/' + id }; });
      },
      limit: function (n) { return collRef(coll, n); },
      where: function () { return ref; }, orderBy: function () { return ref; },
      get: function () {
        return loadColl(coll).then(function () {
          var s = collSnap(coll, null, false);
          if (max && s.docs.length > max) { s.docs = s.docs.slice(0, max); s.size = s.docs.length; }
          return s;
        });
      },
      onSnapshot: function (cb, errCb) {
        var l = { coll: coll, cb: cb, primed: false, last: {} }; collL.push(l);
        loadColl(coll).then(function () {
          if (l.primed) return;
          var docs = collDocs(coll); Object.keys(docs).forEach(function (p) { l.last[p] = JSON.stringify(docs[p]); });
          l.primed = true; cb(collSnap(coll, null, false));
        }).catch(function (e) { if (errCb) errCb(e); });
        return function () { var i = collL.indexOf(l); if (i >= 0) collL.splice(i, 1); };
      }
    };
    return ref;
  }
  function hasListener(f) {
    return docL.some(function (l) { return place(l.path).file === f.name; }) ||
      collL.some(function (l) { return filesOfColl(l.coll).indexOf(f.name) >= 0; });
  }
  var DB = { doc: docRef, collection: function (c) { return collRef(c); } };

  /* ---------- keeping up with everyone else ---------- */
  var lastActive = now();
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) {
    document.addEventListener(ev, function () { lastActive = now(); }, { capture: true, passive: true });
  });
  function poll(force) {
    if (!ready || !(RS() && RS().token())) return;
    if (PREVIEW && !force) return;          /* nothing changes in the preview copy */
    if (!force && document.visibilityState === 'hidden') return;
    var idle = now() - lastActive > IDLE_AFTER;
    Object.keys(F).forEach(function (k) {
      var f = F[k];
      if (!f.loaded || f.flushing || f.pending.length || f.loading || !hasListener(f)) return;
      var gap = hot(k) ? (idle ? IDLE_POLL_MS : POLL_MS) : COOL_POLL_MS;
      if (!force && now() - (f.polledAt || f.loadedAt) < gap) return;
      f.polledAt = now();
      load(f).catch(function () {});
    });
  }
  setInterval(function () { poll(false); }, 5000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') poll(true); });

  /* ---------- who is signed in ----------
     The page stamps each change with the id it is given and shows the name that id
     resolves to. Here the id carries both, "Name <email>", so every person's name
     shows on the history, not only the viewer's own. */
  function me() { var s = RS() && RS().current(); return { name: (s && s.name) || '', email: (s && s.email) || '' }; }
  function myId() { var m = me(); return m.email ? (m.name ? m.name + ' <' + m.email + '>' : m.email) : ''; }
  var NAMES = {};                /* Claude account ids already in the data -> names (from names.json) */
  function nameOf(id) { id = String(id || ''); var i = id.indexOf(' <'); return i > 0 ? id.slice(0, i) : (NAMES[id] || (id === 'claude' ? 'Claude' : '')); }
  var USER = {
    id: function () { return Promise.resolve(myId()); },
    profiles: function (ids) { var o = {}; (ids || []).forEach(function (id) { o[id] = { name: nameOf(id) }; }); return Promise.resolve(o); },
    can: function () { var rs = RS(); return Promise.resolve(!PREVIEW && !!(rs && rs.canEdit && rs.canEdit(PROJECT))); },
    me: function () { return Promise.resolve(me()); },
    profile: function () { return Promise.resolve(me()); }
  };

  /* ---------- files handed to the person ---------- */
  var DOWNLOADS = {
    save: function (o) {

.railhide{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:5px;color:rgba(255,255,255,.75);width:24px;height:24px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.railhide svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.railhide:hover{background:rgba(255,255,255,.14);color:#fff}
.railfind{position:relative;padding:11px 12px 3px;flex:0 0 auto}
.railfind .fi{position:absolute;left:21px;top:20px;width:14px;height:14px;fill:none;stroke:rgba(255,255,255,.5);stroke-width:2;stroke-linecap:round;pointer-events:none}
.railfind input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:6px;color:#fff;font:inherit;font-size:12.5px;padding:6px 26px 6px 30px}
.railfind input::placeholder{color:rgba(255,255,255,.5)}
.railfind input:focus{outline:2px solid var(--sky);outline-offset:-1px;background:rgba(255,255,255,.16)}
.railfind input::-webkit-search-cancel-button{display:none}
.railq-x{position:absolute;right:17px;top:16px;width:20px;height:20px;border:0;border-radius:4px;background:transparent;color:rgba(255,255,255,.6);font-size:15px;line-height:1;padding:0}
.railq-x:hover{background:rgba(255,255,255,.16);color:#fff}
.railhits{margin-top:7px;background:var(--surface);border:1px solid var(--border-strong,#adc4d6);border-radius:6px;box-shadow:0 10px 26px rgba(6,32,47,.3);overflow:hidden auto;max-height:min(52vh,420px)}
.railhits .rh-g{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3);background:var(--sunk);padding:4px 10px;border-bottom:1px solid var(--line);position:sticky;top:0}
.railhits .rh{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 10px;color:var(--ink);font-family:var(--ui);cursor:pointer}
.railhits .rh:last-child{border-bottom:0}
.railhits .rh:hover,.railhits .rh.on{background:var(--accent-soft)}
.railhits .rh b{display:block;font-size:12.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.railhits .rh i{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;color:var(--ink-3);margin-top:1px;overflow-wrap:anywhere}
.railhits .rh-none{padding:10px;font-size:12px;color:var(--ink-3)}
.hq nav{display:flex;flex-direction:column;gap:1px;padding:8px 8px 4px;flex:0 0 auto}
.hq nav a.navlink{text-decoration:none;box-sizing:border-box}
.hq nav a.navlink .ext{margin-left:auto;font-style:normal;font-size:12px;opacity:.6}
.hq nav button,.hq nav a.navlink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;color:rgba(255,255,255,.76);padding:8px 10px;font:inherit;font-family:var(--display);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.hq nav a.navlink svg,.hq nav button svg{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.hq nav a.navlink:hover,.hq nav button:hover{color:#fff;background:rgba(255,255,255,.09)}
.hq nav button[aria-current]{color:#fff;font-weight:600;background:var(--navy-mid,#14486e);box-shadow:inset 3px 0 0 var(--sky)}
.hq nav button[aria-current] svg{opacity:1;stroke:var(--sky)}
.hq nav button:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.hq nav .nbadge{margin-left:auto;font-size:10.5px;font-weight:700;min-width:20px;text-align:center;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.12);color:#fff}
.hq nav .nbadge.hot{background:#c25a4f}
.hq nav .navsep{font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.42);padding:10px 10px 4px}
body.railmini .hq nav .navsep{display:none}
.hq .mast-right{margin-top:auto;display:flex;flex-direction:column;align-items:stretch;gap:1px;padding:8px 8px 10px;border-top:1px solid rgba(80,164,219,.2);flex:0 0 auto}
.railnote{font-size:10.5px;color:rgba(255,255,255,.6);padding:4px 10px 6px;line-height:1.35}
.railnote b{color:#fff;font-weight:600;display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.railnote .ok{color:#7fd8b4}.railnote .no{color:#f3a59b}
.theme-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;color:rgba(255,255,255,.76);padding:8px 10px;font:inherit;font-family:var(--display);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.theme-btn .ti{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.theme-btn .ti-sun{display:none}
:root[data-theme="dark"] .theme-btn .ti-moon{display:none}
:root[data-theme="dark"] .theme-btn .ti-sun{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme-btn .ti-moon{display:none}:root:not([data-theme="light"]) .theme-btn .ti-sun{display:block}}
.theme-btn:hover:not(:disabled){color:#fff;background:rgba(255,255,255,.09)}
.theme-btn:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.hq .mast-right #theme-btn{margin-top:5px;padding-top:11px;border-top:1px solid rgba(80,164,219,.18);border-radius:0 0 6px 6px}
.railscrim{position:fixed;inset:0;z-index:94;background:rgba(6,32,47,.42);border:0;padding:0;display:none}
@media(max-width:900px){
  body:not(.railmini){padding-left:var(--rail-mini)}
  body:not(.railmini) .hqtop{margin-left:calc(0px - var(--rail-mini));width:calc(100% + var(--rail-mini))}
  body:not(.railmini) .hq.rail{box-shadow:4px 0 26px rgba(6,32,47,.4)}
  body:not(.railmini) .railscrim{display:block}
}

/* ===== page ===== */
main{padding-block:22px 60px;padding-left:max(22px, env(safe-area-inset-left,0px));padding-right:max(22px, env(safe-area-inset-right,0px));min-width:0}
main select{max-width:260px}
@media(max-width:600px){main{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}}
.page[hidden]{display:none}
.phead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.phead .eyebrow{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.phead h1{font-size:27px;font-weight:700;line-height:1.15;color:var(--ink)}
.phead .sub{color:var(--ink-2);font-size:13.5px;margin-top:3px}
.phead .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.flabel{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
select,input[type=text],input[type=number],input[type=url],input[type=search].plain,textarea{
  background:var(--surface);border:1px solid var(--border-strong);border-radius:5px;padding:7px 10px;color:var(--ink);font-size:13.5px;min-width:0;width:100%}
textarea{min-height:84px;resize:vertical;line-height:1.5}
select:focus,input:focus,textarea:focus{outline:2px solid var(--sky);outline-offset:0}

/* buttons: shaped like the theme toggle — small rounded rectangle, thin border */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-width:max-content;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:5px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;line-height:1.2}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-mid)}
:root[data-theme="dark"] .btn.pri{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* the navy band with figure boxes */
.band{background:var(--band);color:var(--band-ink);border-radius:8px;padding:16px 18px 18px;margin-bottom:22px;border:1px solid var(--band-line)}
.band .today{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--sky)}
.band .say{font-size:16.5px;font-weight:600;line-height:1.45;margin:6px 0 14px}
.band .say em{font-style:normal;color:var(--sky)}
em,i,cite,dfn,var,address{font-style:normal}  /* no italics anywhere */
/* Branding */
.brorders{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.brorders .lnk{font-size:13.5px}
.brbar{height:5px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:8px;overflow:hidden}
.brbar i{display:block;height:100%;background:var(--sky);border-radius:3px}
.brkinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:6px 22px;padding:14px 16px}
.brk{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;align-items:center;gap:10px;border:1px solid transparent;background:none;color:inherit;font:inherit;text-align:left;padding:7px 8px;border-radius:6px;cursor:pointer}
.brk:hover{background:var(--surface-3)}
.brk.on{border-color:var(--sky);background:var(--accent-soft)}
.brk-n{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brk-bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.brk-bar i{display:block;height:100%;background:var(--good);border-radius:3px}
.brk-c{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
/* Image Library */
.im-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.im-filters select,.im-filters input[type=search]{height:34px;font-size:13px;min-width:0;width:auto}
.im-filters input[type=search]{width:min(220px,100%)}
.im-arch{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.imgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:16px}
.imcard{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;min-width:0;transition:border-color .15s,box-shadow .15s,transform .15s}
.imcard:hover,.imcard:focus-visible{border-color:var(--sky);box-shadow:0 8px 22px -14px rgba(7,29,46,.55);transform:translateY(-1px);outline:none}
.imcard.arch{opacity:.6}
.imcard{position:relative}
.imsel{position:absolute;top:8px;left:8px;z-index:2;background:var(--surface);border:1px solid var(--border);border-radius:5px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.imsel input{width:16px;height:16px;margin:0;accent-color:var(--navy,#0d314c);cursor:pointer}
.imnote{display:block;font:600 11px/1.3 Arial,Helvetica,sans-serif;color:#9a5b00;background:#fff4e0;border:1px dashed #e0a440;padding:6px 8px;margin:-10px 0 14px}
.imthumb{aspect-ratio:16/10;background:repeating-conic-gradient(var(--rule) 0 25%,transparent 0 50%) 0 0/16px 16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.imthumb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.imload{font-size:12px;color:var(--ink-3)}
.imbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.imbody>b{font-size:13.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.immeta{display:flex;gap:5px;flex-wrap:wrap}
.imsub{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.imact{display:flex;gap:6px;margin-top:2px}
.impv{background:repeating-conic-gradient(var(--rule) 0 25%,transparent 0 50%) 0 0/16px 16px;border:1px solid var(--border);border-radius:8px;display:flex;justify-content:center;max-height:340px;overflow:hidden}
.impv img{max-width:100%;max-height:340px;object-fit:contain;display:block}
.imstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin-top:10px;width:100%}
.impick{aspect-ratio:1;border:1px solid var(--border);border-radius:6px;padding:0;background:var(--surface-2,#f4f7fa);overflow:hidden;cursor:pointer}
.impick:hover,.impick:focus-visible{border-color:var(--sky);outline:2px solid var(--sky);outline-offset:1px}
.impick img{width:100%;height:100%;object-fit:cover;display:block}
.impick span{display:flex;align-items:center;justify-content:center;height:100%;padding:6px;font-size:10px;line-height:1.25;color:var(--ink-3);text-align:center;overflow:hidden}
.impick.loading{background:linear-gradient(100deg,var(--surface-2) 30%,var(--surface-3) 50%,var(--surface-2) 70%);background-size:300% 100%;animation:imshim 1.3s linear infinite}
@keyframes imshim{from{background-position:100% 0}to{background-position:0 0}}
.impick.missing span{color:var(--bad)}
body.im-drop #page-images .card{outline:3px dashed var(--sky);outline-offset:4px}
body.im-drop #page-images::before{content:"Drop to add to the Image Library";display:block;text-align:center;font-weight:600;color:var(--sky);margin-bottom:10px}
.band .say .hot{color:#f3a59b}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tile{background:var(--band-tile);border:1px solid var(--band-line);border-radius:6px;padding:12px 14px;min-width:0;text-align:left;color:inherit;font:inherit;cursor:default}
button.tile{cursor:pointer}
button.tile:hover{background:rgba(255,255,255,.12)}
.tile .v{font-size:27px;font-weight:700;line-height:1.1}
.tile .v.hot{color:#f3a59b}
.tile .v.sky{color:var(--sky)}
.tile .k{font-size:12.5px;font-weight:600;color:var(--sky);margin-top:5px}
.tile .s{font-size:11.5px;color:rgba(255,255,255,.62);margin-top:1px}

/* cards & sections */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;min-width:0}
.card+.card{margin-top:22px}
.card>.ch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.card>.ch h2{font-size:15.5px;font-weight:700}
.card>.ch .cnt{font-size:11.5px;font-weight:700;color:var(--ink-3);background:var(--surface-3);border-radius:4px;padding:2px 7px}
.card>.ch .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card>.cb{padding:14px 16px}
.card>.cb.flush{padding:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}
.note{color:var(--ink-3);font-size:12.5px}
.foot{color:var(--ink-3);font-size:11.5px;margin-top:26px;line-height:1.5}
.empty{padding:22px 16px;color:var(--ink-2);font-size:13.5px}
.empty b{color:var(--ink)}

/* sub-tab buttons (Summit HQ: The Plan / Planning Meeting / All Tasks) */
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.subtabs button{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:5px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.subtabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .subtabs button[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .subtabs button[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--navy-deep)}}
.subtabs .n{font-size:11px;font-weight:700;color:var(--bad)}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
table.t td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:var(--accent-soft)}
table.t td.n,table.t th.n{text-align:right}
table.t td .t2{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}
table.t tr.past td{color:var(--ink-3)}
table.t tr.slot td{color:var(--ink-3);font-style:normal}

/* chips: rectangles with slightly rounded corners, never pills */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;border-radius:4px;padding:2px 7px;white-space:nowrap;border:1px solid transparent;line-height:1.4}
.chip.wait{background:var(--surface-3);color:var(--ink-2)}
.chip.in{background:var(--accent-soft);color:var(--navy-mid);border-color:var(--border)}
.chip.review{background:var(--warn-soft);color:var(--warn)}
.chip.changes{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.ch{background:transparent;border-color:var(--border-strong);color:var(--ink-2)}
:root[data-theme="dark"] .chip.in{color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.in{color:var(--sky)}}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.k-matters{--k:var(--c1)} .k-micdup{--k:var(--c2)} .k-linkedin{--k:var(--c3)} .k-youtube{--k:var(--c5)} .k-mailchimp{--k:var(--c4)} .k-summit{--k:var(--c6)} .k-orders{--k:var(--warn)} .k-news{--k:var(--ink-3)} .k-setup{--k:var(--navy-mid)} .k-community{--k:#8a6bd1} .k-other{--k:var(--ink-3)} .k-request{--k:#c0582b}
.dot{background:var(--k,var(--ink-3))}
.ticks{display:inline-flex;gap:3px;align-items:center}
.tk{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;font-size:10px;font-weight:700;border:1px solid var(--border-strong);color:var(--ink-3)}
.tk.on{background:var(--good);border-color:var(--good);color:#fff}
.tk.due{border-color:var(--bad);color:var(--bad)}

/* calendar */
.calnav{display:flex;align-items:center;gap:8px}
.calnav .m{font-weight:700;font-size:15px;min-width:140px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) repeat(2,minmax(0,.55fr));border-top:1px solid var(--rule)}
.cal .dh{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-3);padding:7px 8px;background:var(--surface-2);border-bottom:1px solid var(--border);text-align:center}
.cal .d{min-height:104px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:5px 5px 7px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .d:nth-child(7n){border-right:0}
.cal .d.out{background:var(--surface-2)}
.cal .d.out .num{color:var(--ink-3);opacity:.6}
.cal .d.today{background:var(--accent-soft)}
.cal .d.today .num{background:var(--navy);color:#fff;border-radius:4px;padding:0 5px}
.cal .d.we{background:var(--surface-2)}
.cal .num{font-size:11.5px;font-weight:700;color:var(--ink-2);align-self:flex-start}
.ev{display:flex;align-items:center;gap:5px;font-size:11px;line-height:1.25;border:1px solid var(--border);border-left:3px solid var(--k,var(--ink-3));background:var(--surface);border-radius:4px;padding:3px 5px;cursor:pointer;text-align:left;width:100%;min-width:0;color:var(--ink)}
.ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ev:hover{background:var(--accent-soft)}
.ev.done span{text-decoration:line-through;color:var(--ink-3)}
.ev.big{font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding:10px 16px;border-top:1px solid var(--rule)}
.legend span{display:inline-flex;align-items:center;gap:6px}
@media(max-width:760px){.cal{grid-template-columns:repeat(7,minmax(0,1fr))}.cal .d{min-height:70px}.ev span{display:none}.ev{padding:3px;justify-content:center;width:auto}}

/* agenda list */
.agenda{display:flex;flex-direction:column}
.agday{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:10px 16px;border-bottom:1px solid var(--rule)}
.agday:last-child{border-bottom:0}
.agday .dl{font-size:12px;font-weight:700;color:var(--ink-2)}
.agday .dl small{display:block;font-weight:500;color:var(--ink-3)}
.agday.today .dl{color:var(--navy-mid)}
.agitems{display:flex;flex-direction:column;gap:5px;min-width:0}
.agi{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;background:none;border:0;padding:2px 0;text-align:left;color:var(--ink);min-width:0}
.agi:hover .tt{text-decoration:underline}
.agi .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.agi .who{color:var(--ink-3);font-size:11.5px;margin-left:auto;white-space:nowrap}

/* checklists */
.checks{display:flex;flex-direction:column}
.chk{display:flex;align-items:flex-start;gap:10px;padding:9px 16px;border-bottom:1px solid var(--rule)}
.chk:last-child{border-bottom:0}
.chk input{width:16px;height:16px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--good)}
.chk .ct{flex:1;min-width:0}
.chk .ct b{font-weight:600;display:block}
.chk .ct small{color:var(--ink-3);font-size:12px;display:block}
.chk.done .ct b{text-decoration:line-through;color:var(--ink-3)}
.chk .meta{font-size:11.5px;color:var(--ink-3);white-space:nowrap;text-align:right}
.chk .meta.late{color:var(--bad);font-weight:700}
.chk button.lnk{background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:left;font:inherit}
.chk button.lnk:hover b{text-decoration:underline}

/* Schedule: Next Two Weeks */
.agcard .ch .note{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.agwk{border-bottom:1px solid var(--rule)}
.agwk:last-child{border-bottom:0}
.agwh{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.agwh span{font-size:10.5px;letter-spacing:0;background:var(--surface-3);color:var(--ink-2);border-radius:4px;padding:1px 6px}
.agwk.late{background:var(--bad-soft)}
.agwk.late .agwh,.sgrp.late .agwh{color:var(--bad)}
.agwk.late .agwh span,.sgrp.late .agwh span{background:var(--bad);color:#fff}
.agcard .agday{grid-template-columns:52px minmax(0,1fr);gap:14px;padding:8px 16px 10px;border-bottom:0;align-items:start}
.agdate{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:5px 0 6px;line-height:1.05;text-align:center}
.agdate small{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.agdate b{font-size:20px;font-weight:700;color:var(--ink);margin:1px 0}
.agdate.today{background:var(--navy);border-color:var(--navy)}
.agdate.today small,.agdate.today b{color:#fff}
.agdate.today small:first-child{color:var(--sky)}
.agdate.late{border-color:var(--bad);color:var(--bad)}
.agdate.late b,.agdate.late small{color:var(--bad)}
.agcard .agitems{gap:6px}
.agcard .agi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:7px 10px;border:1px solid var(--border);border-left:3px solid var(--k,var(--ink-3));border-radius:5px;background:var(--surface);font-size:13px;transition:background .12s,border-color .12s}
.agcard .agi:hover{background:var(--surface-2);border-color:var(--border-strong);border-left-color:var(--k,var(--ink-3))}
.agcard .agi:hover .tt{text-decoration:none}
.agcard .agi.big .tt{font-weight:700}
.agcard .agi.slot{border-style:dashed;border-left-style:solid;background:transparent}
.agk{font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--k,var(--ink-3));background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;white-space:nowrap;min-width:64px;text-align:center}
.agcard .agi .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agl{font-size:11px;font-weight:700;color:var(--bad);margin-left:4px}
.who{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);white-space:nowrap;margin-left:auto}
.who.none{min-width:0}
.av{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700;font-style:normal;color:#fff;background:var(--navy-mid);flex:0 0 auto}
.av.t1{background:#14486e}.av.t2{background:#1a8fe3}.av.t3{background:#0f7b5c}.av.t4{background:#8a6bd1}.av.t5{background:#c0582b}.av.t6{background:#4f6b82}.av.t7{background:#a2701a}.av.t8{background:#b3372c}
@media(max-width:560px){.agcard .agi{grid-template-columns:minmax(0,1fr) auto}.agk{display:none}.who .wn{display:none}.agcard .ch .note{display:none}}

/* Schedule: Getting Set Up */
.sprog{padding:12px 16px 14px;border-bottom:1px solid var(--rule)}
.sprog-t{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-bottom:7px}
.sprog-t b{font-weight:700;color:var(--ink)}
.sprog-t span{font-size:12px;font-weight:700;color:var(--good)}
.sbar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--good),#4fc79b)}
.sgrp{border-bottom:1px solid var(--rule)}
.sgrp.late{background:var(--bad-soft)}
.sgrp .checks{padding:2px 0 6px}
.setcard .chk{padding:8px 16px;border-bottom:0;align-items:center;gap:12px}
.setcard .chk+.chk{border-top:1px solid var(--rule)}
.sgrp.late .chk+.chk{border-top-color:rgba(179,55,44,.15)}
.setcard .chk input{width:18px;height:18px;margin:0;cursor:pointer}
.setcard .chk .ct b{font-size:13.5px;line-height:1.35}
.setcard .chk .ct small{font-size:12px;line-height:1.4;margin-top:1px}
.setcard .chk .meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.setcard .chk .meta .who{margin-left:0}
.due{font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.due.soon{background:var(--warn-soft);color:var(--warn)}
.due.late{background:var(--bad);color:#fff}
.setcard .chk.done .due{background:var(--good-soft);color:var(--good)}
.setcard .chk.done .av{opacity:.55}
.sdone-t{display:block;width:100%;background:none;border:0;border-top:1px solid var(--rule);padding:10px 16px;font:inherit;font-size:12.5px;font-weight:600;color:var(--navy-mid);text-align:left;cursor:pointer}
.sdone-t:hover{background:var(--surface-2)}
.sdone-t.smore{border-top:1px dashed var(--rule);padding:8px 16px 10px;font-weight:600}
.sgrp.done{border-bottom:0;background:var(--surface-2)}
.sdone-all{color:var(--good);font-weight:600}
:root[data-theme="dark"] .sdone-t{color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sdone-t{color:var(--sky)}}
@media(max-width:560px){.setcard .who .wn{display:none}}

/* Requests */
.rqbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.rqbar select{width:auto;min-width:180px}
.rqbar input{flex:1 1 220px;width:auto}
.rqboard{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px;align-items:start}
.rqcol{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;min-width:0;display:flex;flex-direction:column}
.rqcol-h{display:flex;align-items:center;gap:8px;padding:11px 14px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);border-bottom:1px solid var(--border);border-top:3px solid var(--rqc,var(--border-strong));border-radius:8px 8px 0 0}
.rqcol-h b{margin-left:auto;font-size:11px;letter-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 7px;color:var(--ink)}
.rq-new{--rqc:#c0582b}.rq-review{--rqc:var(--warn)}.rq-work{--rqc:#1a8fe3}.rq-done{--rqc:var(--good)}
.rq-new .rqcol-h b{background:#c0582b;border-color:#c0582b;color:#fff}
.rqcol-b{display:flex;flex-direction:column;gap:10px;padding:12px}
.rqnone{font-size:12.5px;color:var(--ink-3);padding:14px 6px;text-align:center}
.rqc{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:12px 13px;cursor:pointer;font:inherit;color:var(--ink);box-shadow:0 1px 2px rgba(6,32,47,.05);transition:border-color .12s,box-shadow .12s,transform .12s}
.rqc:hover{border-color:var(--border-strong);box-shadow:0 6px 16px -8px rgba(6,32,47,.35);transform:translateY(-1px)}
.rqc.fresh{border-left:3px solid #c0582b}
.rqc-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rqt{font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--navy-mid);background:var(--sky-wash);border-radius:4px;padding:2px 7px;white-space:nowrap}
:root[data-theme="dark"] .rqt{color:var(--sky);background:var(--surface-3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rqt{color:var(--sky);background:var(--surface-3)}}
.rqc-t{font-size:14px;font-weight:700;line-height:1.3}
.rqc-d{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.rqc-by{font-size:11.5px;color:var(--ink-3)}
.rqc-foot{display:flex;align-items:center;gap:8px;margin-top:2px}
.rqc-foot .who{margin-left:auto}
.rqc-foot .who .wn{display:none}
.rqc-ln{font-size:11px;color:var(--good);font-weight:600}
.rqdec{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:14px}
.rqasked{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid #c0582b;border-radius:7px;padding:14px 16px;margin:0 0 16px}
.rqasked h3{margin:8px 0 6px;font-size:17px;line-height:1.3}
.rqasked p{margin:0 0 12px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.rqa-h{display:flex;align-items:center;gap:10px}
.rqa-when{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.rqa-r{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;font-size:13px;padding:5px 0;border-top:1px solid var(--rule)}
.rqa-r span{color:var(--ink-3);font-size:12px;font-weight:600}
.rqa-r a{word-break:break-all}
@media(max-width:700px){.rqboard{grid-template-columns:repeat(4,minmax(240px,82vw));scroll-snap-type:x mandatory}.rqcol{scroll-snap-align:start}}

/* Mic'd Up YouTube Kit */
.kitcard .ch select{width:auto;min-width:150px}
.kitcard .ch .note{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpost{margin:0;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--surface-2);font-size:13px}
.kpost summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
.kpost p{margin:8px 0 2px;color:var(--ink-2);line-height:1.5}
.ksteps{display:flex;flex-direction:column}
.kstep{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;padding:16px;border-bottom:1px solid var(--rule)}
.kstep:last-child{border-bottom:0}
.kn{width:30px;height:30px;border-radius:50%;background:var(--surface-3);color:var(--ink-2);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.kstep.done .kn{background:var(--good);color:#fff}
.kt{font-weight:700;font-size:14.5px;margin:4px 0 10px}
.kfile{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--border);border-radius:7px;padding:10px 12px;background:var(--surface)}
.kfile>div{flex:1 1 220px;min-width:0}
.kfile b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kfile small{color:var(--ink-3);font-size:12px}
.kic{width:34px;height:34px;border-radius:7px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.kthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.kthumb{border:2px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.kthumb.on{border-color:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.kthumb-i{display:block;width:100%;padding:0;border:0;background:var(--surface-2);cursor:pointer;aspect-ratio:16/9}
.kthumb-i img{width:100%;height:100%;object-fit:cover;display:block}
.kthumb-f{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;font-size:12px;color:var(--ink-3)}
.kthumb-f span{flex:1 1 100%}
.kcopy{margin-bottom:10px}
.kcopy-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.kcopy textarea,.kcopy input{font-size:13.5px;line-height:1.5}
.kbtns{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.kbtns input{flex:1 1 240px;width:auto}
.ktx-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ktx-l{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto;border:1px solid var(--border);border-radius:6px;padding:8px 10px;background:var(--surface)}
.ktx-r{display:flex;align-items:center;gap:8px;font-size:13px}
.ktx-r s{color:var(--bad)}
.ktx-r small{color:var(--ink-3);margin-left:auto;white-space:nowrap}
.ktx-ok{color:var(--good);font-weight:600;font-size:13.5px}
.kli-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.kli-note{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:8px 12px;font-size:13px;margin:0 0 8px}
.kli-amy{border:1px solid var(--warn);background:var(--warn-soft);border-radius:7px;padding:10px 12px;margin-top:6px}
.kli-amy textarea{margin:6px 0 0;min-height:56px}
.kli-go{border:1px solid var(--good);background:var(--good-soft);border-radius:7px;padding:10px 14px;margin-top:6px;font-size:13px}
.kli-go ol{margin:6px 0 4px 18px;padding:0;line-height:1.7}
.kcopy textarea[readonly],.kcopy input[readonly]{background:var(--surface-2)}
.ktx-add{display:flex;align-items:center;gap:6px;flex:1 1 300px}
.ktx-add input{flex:1;width:auto;font-size:12.5px;padding:5px 8px}

/* milestones */
.miles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0;border:1px solid var(--border);border-radius:8px;background:var(--surface);overflow:hidden;margin-bottom:22px}
.mile{padding:11px 12px;border-right:1px solid var(--rule);position:relative;cursor:pointer;background:none;border-top:0;border-bottom:0;border-left:0;text-align:left;color:var(--ink);font:inherit}
.mile:last-child{border-right:0}
.mile:hover{background:var(--accent-soft)}
.mile .ml{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.mile .md{font-size:15px;font-weight:700;margin-top:3px}
.mile .mw{font-size:11.5px;color:var(--ink-2);margin-top:1px}
.mile::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--border)}
.mile.done::before{background:var(--good)}
.mile.next::before{background:var(--sky)}
.mile.late::before{background:var(--bad)}
.mile.done .md{color:var(--good)}
.mile.late .md{color:var(--bad)}

/* edition sections list */
.secrow{display:grid;grid-template-columns:22px 22px minmax(0,1.4fr) minmax(0,2fr) 128px 156px;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--rule);cursor:pointer;background:var(--surface)}
.secrow:last-child{border-bottom:0}
.secrow:hover{background:var(--accent-soft)}
.secrow.off{opacity:.55}
.secrow.dragging{opacity:.35}
.secrow.over{box-shadow:inset 0 3px 0 var(--sky)}
.secrow .grip{cursor:grab;color:var(--ink-3);display:flex;align-items:center;justify-content:center}
.secrow .grip svg{width:14px;height:14px;fill:currentColor}
.secrow input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--navy-mid)}
.secrow .sn b{display:block;font-weight:700;font-size:13.5px}
.secrow .sn small{color:var(--ink-3);font-size:11.5px}
.secrow .sx{color:var(--ink-2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.secrow .sx i{color:var(--ink-3);font-style:normal}
.secrow .reuse{display:flex;gap:3px}
.rz{font-size:9.5px;font-weight:700;border:1px solid var(--border-strong);color:var(--ink-3);border-radius:3px;padding:1px 4px}
.rz.on{background:var(--k);border-color:var(--k);color:#fff}
@media(max-width:900px){.secrow{grid-template-columns:22px 22px minmax(0,1fr) auto}.secrow .sx,.secrow .reuse{display:none}}

/* email preview */
.mailwrap{background:var(--surface-3);border-radius:8px;padding:18px;overflow-x:auto}
.mailwrap .mail{max-width:660px;margin:0 auto;background:#fff;color:#1d2b36;box-shadow:0 2px 14px rgba(6,32,47,.14)}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:9px;padding:14px 16px}
.fr{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:12.5px}
.fr .bar{height:18px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.fr .bar i{display:block;height:100%;background:var(--c1)}
.fr .fv{text-align:right;font-weight:700}

/* right-hand panel */
.pane{position:fixed;top:calc(var(--hq-h) + env(safe-area-inset-top,0px));right:0;bottom:0;width:min(76vw,1180px);z-index:96;background:var(--surface);
  border-left:1px solid var(--border-strong);box-shadow:-10px 0 34px rgba(6,32,47,.22);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .22s cubic-bezier(.4,0,.2,1);
  padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pane.open{transform:none}
@media(max-width:760px){.pane{width:100%}}
@media (prefers-reduced-motion:reduce){.pane{transition:none}}
.pane .ph{display:flex;align-items:flex-start;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--rule)}
.pane .ph .pe{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.pane .ph h2{font-size:20px;font-weight:700;margin-top:2px}
.pane .ph .x{margin-left:auto}
.pane .pb{flex:1;overflow:auto;padding:16px 20px 24px}
.pane .pf{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--rule);background:var(--surface-2);flex-wrap:wrap}
.pane .pf .sp{flex:1}
.pane .pf .msg{font-size:12.5px;color:var(--ink-2)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px 16px}
.fgrid .wide{grid-column:1/-1}
.fsec{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--navy-mid);margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--rule)}
:root[data-theme="dark"] .fsec{color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fsec{color:var(--sky)}}
.fsec:first-child{margin-top:0;padding-top:0;border-top:0}
.cbs{display:flex;flex-wrap:wrap;gap:8px 18px}
.cbs label{display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;line-height:1.2}
.cbs input{width:16px;height:16px;margin:0;accent-color:var(--good)}
.datef{display:flex;gap:6px}
.datef input[type=text]{flex:1}
.datef .calb{width:36px;padding:0;flex:0 0 auto}
.datef .calb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}

.ro{font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--border);border-radius:5px;padding:8px 10px}

.hflow span{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--c2)}
.hflow b{display:block;font-size:13.5px;margin-top:3px}
.hflow small{display:block;font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.4}
.faq dt{font-weight:700;margin-top:14px}
.faq dd{margin:4px 0 0}
.helpnext{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--rule);flex-wrap:wrap}
.feedrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.feedst{display:grid;grid-template-columns:12px 1fr;gap:2px 8px;align-items:center}
.feedst small{grid-column:2;color:var(--ink-3);font-size:12px}
.fdot{width:10px;height:10px;border-radius:50%;background:var(--border-strong)}
.fdot.on{background:var(--good)}
/* swimlanes: the next four weeks, one lane per channel */
.lanes{position:relative;padding:8px 16px 14px}
.lanehead{display:grid;grid-template-columns:128px minmax(0,1fr);margin-bottom:4px}
.lanehead .wk{position:relative;height:18px;overflow:hidden}
.lanehead .wk span{position:absolute;top:0;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink-3);transform:translateX(2px);white-space:nowrap}
.lane{display:grid;grid-template-columns:128px minmax(0,1fr);align-items:center;height:38px;border-top:1px solid var(--rule)}
.lane .ln{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.lane .tr{position:relative;height:100%}
.tr .wkend{position:absolute;top:0;bottom:0;background:var(--surface-2)}
.tr .tline{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--sky);border-radius:1px;z-index:2}
.lanes .tlabel{position:absolute;top:-2px;font-size:10px;font-weight:700;color:var(--navy-mid);background:var(--accent-soft);padding:1px 5px;border-radius:3px;transform:translateX(-50%);z-index:3;white-space:nowrap}
.mk{position:absolute;top:50%;transform:translate(-50%,-50%);min-width:18px;height:18px;border-radius:5px;border:0;background:var(--k);color:#fff;font-size:10px;font-weight:700;padding:0 4px;cursor:pointer;z-index:3;box-shadow:0 1px 3px rgba(6,32,47,.25);transition:transform .15s}
.mk:hover,.mk:focus-visible{transform:translate(-50%,-50%) scale(1.35);outline:none;z-index:5}
.mk.done{background:var(--surface);border:2px solid var(--k);color:var(--k)}
.mk.slot{background:transparent;border:2px dashed var(--k);color:var(--k)}
.mk.big{height:24px;min-width:24px;border-radius:6px;box-shadow:0 0 0 4px color-mix(in srgb,var(--k) 25%,transparent)}
.mk.late{animation:mkpulse 1.6s ease-in-out infinite}
@keyframes mkpulse{0%,100%{box-shadow:0 0 0 0 rgba(179,55,44,.55)}50%{box-shadow:0 0 0 7px rgba(179,55,44,0)}}

.rlegend i{width:10px;height:10px;border-radius:2px;display:inline-block}

.onair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center;margin-bottom:16px}

.wave{display:flex;align-items:center;gap:3px;height:86px}
.wave i{flex:1;min-width:2px;border-radius:2px;background:linear-gradient(180deg,var(--sky),#eb6834);height:var(--h);transform-origin:center;animation:wv 1.2s ease-in-out infinite;animation-delay:var(--d);opacity:.9}

  vals("orders").filter(o=>!o.archived && o.status!=="cancelled").forEach(o=>{

  return ev;
}

const CAL_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
function buildFields(fields, d){

  (fields||[]).forEach(f=>{
    if(f.sec){ close(); h+='<div class="fsec">'+esc(f.sec)+'</div>'; return; }

    else if(f.type==="checks") h+='<div class="cbs" id="'+id+'">'+f.opts.map(([ov,ol])=>'<label><input type="checkbox" value="'+esc(ov)+'"'+(v&&v[ov]?" checked":"")+'> '+esc(ol)+'</label>').join("")+'</div>';
    else if(f.type==="cb") h+='<div class="cbs"><label><input type="checkbox" id="'+id+'"'+(v?" checked":"")+'> '+esc(f.label)+'</label></div>';
    else if(f.type==="ro") h+='<div class="ro" id="'+id+'">'+esc(v||"—")+'</div>';

    h+='</div>';
  });
  close(); return h;
}
function wireFields(root){

function readFields(fields){

/* reading a spreadsheet or CSV someone drops in (SheetJS, loaded from cdnjs) */
function readSheet(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ try{
      if(!window.XLSX) throw new Error("The spreadsheet reader didn't load. Check your connection and reload the page.");
      const wb=XLSX.read(new Uint8Array(fr.result),{type:"array",cellDates:true});
      let best=[]; wb.SheetNames.forEach(n=>{ const raw=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:"",raw:false});
        let h=raw.findIndex(r=>r.filter(c=>String(c).trim()).length>=2 && r.some(c=>/mail|title|views|impressions|video|content|subject|post/i.test(String(c)))); if(h<0) h=0;
        const head=raw[h].map(c=>String(c).trim()); const rows=raw.slice(h+1).filter(r=>r.some(c=>String(c).trim())).map(r=>Object.fromEntries(head.map((k,i)=>[k,r[i]])));
        if(rows.length>best.length) best=rows; });
      res(best);
    }catch(e){ rej(e); } };
    fr.onerror=()=>rej(new Error("Couldn't read that file.")); fr.readAsArrayBuffer(file);
  });
}

      '<div class="field"><label class="flabel" for="rs-yt">YouTube Studio Export</label><input type="file" id="rs-yt" accept=".csv,.xlsx"><span class="hint">Analytics › Advanced mode › Content › Export. Matched to episodes by the number in the title.</span></div>'+

  $$(".tile[data-go]",el).forEach(b=>b.onclick=()=>go(b.dataset.go));
  const msg=$("#rs-msg",el);
  $("#rs-yt",el).onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const rows=await readSheet(f); let n=0, miss=[];
    for(const r of rows){ const title=col(r,/title|content|video/i); const m=title.match(/ep(?:isode)?\.?\s*(\d{1,3})/i); if(!m) continue; const ep=vals("episodes").find(x=>+x.num===+m[1]); if(!ep){ miss.push(m[1]); continue; }
      const views=num(col(r,/^views$/i)), hrs=num(col(r,/watch time/i)), likes=num(col(r,/likes/i));
      await patch("episodes",ep.id,{views, watchHours:hrs, likes, youtubeDone:true}); n++; }
    msg.textContent=n+" episode"+(n===1?"":"s")+" updated from YouTube."+(miss.length?" Not logged here yet: Ep "+miss.join(", "):""); }catch(err){ msg.textContent=err.message; } };
  $("#rs-li",el).onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const rows=await readSheet(f); let n=0, added=0;
    for(const r of rows){ const link=col(r,/post link|link|url/i), text=col(r,/post title|title|update|commentary|content/i), d=isoFrom(col(r,/created|date|posted/i));
      const st={impressions:num(col(r,/^impressions/i)), clicks:num(col(r,/^clicks/i)), reactions:num(col(r,/reactions|likes/i)), comments:num(col(r,/comments/i)), reposts:num(col(r,/reposts|shares/i))};
      if(!st.impressions && !text) continue;
      const ep=vals("episodes").find(x=>(x.linkedinUrl&&link&&x.linkedinUrl===link) || (/mic.?d up/i.test(text) && x.num && new RegExp("(ep(isode)?\\.?\\s*)"+x.num+"\\b","i").test(text)));
      if(ep){ await patch("episodes",ep.id,{liImpressions:st.impressions, liClicks:st.clicks, liReactions:st.reactions, linkedinDone:true, linkedinUrl:ep.linkedinUrl||link}); n++; continue; }
      const p=vals("pieces").find(x=>x.channel==="linkedin" && ((x.postedUrl&&x.postedUrl===link) || (d && x.date===d && text && x.title && text.toLowerCase().includes(x.title.toLowerCase().slice(0,25)))));
      if(p){ await patch("pieces",p.id,Object.assign({status:"done"},st)); n++; }
      else { await put("pieces",uid("p"),Object.assign({channel:"linkedin",title:text.slice(0,90)||"LinkedIn post",copy:text,date:d,status:"done",postedUrl:link,kind:"Other",owner:""},st)); added++; } }
    msg.textContent=n+" matched and "+added+" new LinkedIn posts brought in."; }catch(err){ msg.textContent=err.message; } };
  $("#rs-mc",el).onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const rows=await readSheet(f); let n=0, added=0;
    for(const r of rows){ const subj=col(r,/subject|title|campaign/i), d=isoFrom(col(r,/send date|sent|date/i)); if(!subj) continue;
      const st={sent:num(col(r,/total recipients|recipients|emails sent|sent to/i)), opens:num(col(r,/unique opens|opens/i)), clicks:num(col(r,/unique clicks|clicks/i)), unsubs:num(col(r,/unsub/i)), audience:col(r,/list|audience/i)};
      const p=vals("pieces").find(x=>x.channel==="mailchimp" && x.title && x.title.toLowerCase()===subj.toLowerCase());
      if(p){ await patch("pieces",p.id,Object.assign({status:"done"},st)); n++; } else { await put("pieces",uid("p"),Object.assign({channel:"mailchimp",title:subj,date:d,status:"done"},st)); added++; } }
    msg.textContent=n+" matched and "+added+" new Mailchimp sends brought in."; }catch(err){ msg.textContent=err.message; } };
}

/* ================= the daily stats feed (Power Automate writes data/feeds.json) ================= */
function feed(k){ return S.feeds[k] || null; }
function ytId(u){ const m=String(u||"").match(/(?:v=|youtu\.be\/|shorts\/)([\w-]{6,})/); return m?m[1]:""; }
function ytStat(e,k){ if(+e[k]) return +e[k]; const f=feed("youtube"); const v=f&&f.videos&&f.videos[ytId(e.youtubeUrl)]; return v? (+v[k]||0) : 0; }
function epViews(e){ return ytStat(e,"views"); }
function edStats(ed){
  if(ed.stats && +ed.stats.recipients) return ed.stats;
  const f=feed("matters"); const m=f && (f.mailings||[]).find(x=>x.month===ed.month);
  return m ? {recipients:m.sent, delivered:m.delivered||m.sent, opens:m.opens, clicks:m.clicks, unsubs:m.unsubs, bounces:m.bounces, topLinks:(m.topLinks||[]).join("\n"), fromFeed:true} : (ed.stats||{});
}
function feedCampaigns(){ const f=feed("mailchimp"); return (f&&f.campaigns)||[]; }
function feedAge(k){ const f=feed(k); if(!f||!f.updated) return ""; const d=new Date(f.updated); return isNaN(d)?"":(MON[d.getMonth()]+" "+d.getDate()+", "+d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})); }

 {id:"requests", t:"Requests and the Request Form", g:"Pages", b:`

 {id:"matters", t:"The Monthly MISMO Matters Run", g:"MISMO Matters", b:`
