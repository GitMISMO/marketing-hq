.hlbl{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#fff;padding:3px 9px;border-radius:4px;border:1px solid;--hc:#74bfeb;background:color-mix(in srgb,var(--hc) 22%,transparent);border-color:color-mix(in srgb,var(--hc) 65%,transparent)}
.hlbl i{width:8px;height:8px;border-radius:50%;background:var(--hc);animation:air 1.4s ease-in-out infinite}
.hlbl.t-ok{--hc:#4fc79b}.hlbl.t-li{--hc:#74bfeb}.hlbl.t-yt{--hc:#eb6834}.hlbl.t-sum{--hc:#e0a83c}
.hbig{font-size:52px;font-weight:700;line-height:1;margin-top:12px;letter-spacing:-.025em}
.hbig small{font-size:16px;color:var(--sky);font-weight:600;margin-left:10px;letter-spacing:0}
.hline{font-size:14.5px;font-weight:600;margin-top:8px;color:rgba(255,255,255,.86);line-height:1.4}
.hnext{margin-top:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 12px;align-items:baseline;background:var(--band-tile);border:1px solid var(--band-line);border-left:3px solid var(--sky);border-radius:6px;padding:10px 12px;max-width:440px}
.hnext span{grid-row:span 3;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--sky)}
.hnext b{font-size:15px}.hnext em{font-style:normal;font-size:12.5px;color:var(--sky);font-weight:600}.hnext small{font-size:12px;color:rgba(255,255,255,.62)}
.hbtn{margin-top:16px;background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.hbtn:hover{background:rgba(255,255,255,.1)}
/* MISMO Matters: the paper */
.paperwrap{display:flex;justify-content:center;padding:6px 0}
.paper{position:relative;width:100%;max-width:450px;background:#fbfdff;color:#0d314c;border-radius:6px;box-shadow:0 26px 50px -18px rgba(0,0,0,.65);transform:rotate(-1.6deg);padding:14px;overflow:hidden;transition:transform .35s ease}
.paper:hover{transform:rotate(0) translateY(-3px)}
.pmast{display:flex;align-items:center;gap:12px;background:#0d314c;color:#fff;border-radius:4px;padding:10px 12px;margin-bottom:10px;--logo-body:#fff;--logo-s:#74bfeb}
.pmlogo{height:15px;width:auto;flex:0 0 auto}
.pmast b{display:block;font-size:19px;letter-spacing:-.01em;line-height:1.15}.pmast b span{color:#74bfeb}
.pmast small{font-size:10px;color:#a9d8f3;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:7px 8px 8px;border-radius:4px;border:1px solid #dbe7f0;border-left:4px solid var(--pc);background:#fff;position:relative;min-width:0;transition:transform .15s,box-shadow .15s}
.pb:hover,.pb:focus-visible{transform:translateY(-1px);box-shadow:0 6px 14px -8px rgba(13,49,76,.55)}
.pb:focus-visible{outline:2px solid #1a8fe3;outline-offset:1px}
.pb.lead{grid-column:1/-1}
.pbh{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#0d314c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:14px}
.pbt{font-size:13px;font-weight:700;line-height:1.25;color:#0d314c}
.pbl{display:flex;flex-direction:column;gap:3px}
.pbl i{display:block;height:4px;border-radius:2px;background:var(--pc);opacity:.6}
.pbl i:last-child{width:58%}
.pb.t-w{--pc:#c3d2de;border-left-style:dashed;background:#f5f8fb}
.pb.t-w .pbl i{background:repeating-linear-gradient(90deg,#c3d2de 0 6px,transparent 6px 10px);opacity:1}
.pb.t-w .pbh{color:#56718a}
.pb.t-i{--pc:#74bfeb}.pb.t-r{--pc:#e0a83c}.pb.t-c{--pc:#f08579}.pb.t-a{--pc:#4fc79b}.pb.t-u{--pc:#3987e5}
.pbk{position:absolute;top:5px;right:7px;font-size:11px;color:#0f7b5c;font-weight:700}
.pscan{position:absolute;left:0;right:0;height:70px;top:-70px;background:linear-gradient(180deg,transparent,rgba(116,191,235,.24),transparent);animation:pscan 5s ease-in-out infinite;pointer-events:none}
@keyframes pscan{0%{top:-70px}55%,100%{top:100%}}
/* LinkedIn: the week and the post */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:18px;max-width:460px}
.wkd{background:var(--band-tile);border:1px solid var(--band-line);border-radius:6px;padding:7px 3px 8px;text-align:center;min-height:64px;min-width:0}
.wkd span{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:700}
.wkd b{display:block;font-size:18px;line-height:1.2}
.wkd.now{background:var(--sky);color:#06202f;border-color:var(--sky)}.wkd.now span{color:#06202f}
.wkd.past{opacity:.5}
.wkdots{display:flex;justify-content:center;gap:3px;margin-top:4px;flex-wrap:wrap}
.wkdots i,.wklegend i{width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block}
.wkdots i.live,.wklegend i.live{background:#ff6b5b}.wkdots i.st,.wklegend i.st{background:#e0a83c}.wkdots i.ok,.wklegend i.ok{background:#4fc79b}
.wkd.now .wkdots i{box-shadow:0 0 0 1.5px #06202f}
.wklegend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:rgba(255,255,255,.7)}
.wklegend span{display:inline-flex;align-items:center;gap:5px}
.lipwrap{display:flex;justify-content:center}
.lipost{all:unset;box-sizing:border-box;cursor:pointer;width:100%;max-width:460px;background:#fff;color:#1d2226;border-radius:10px;box-shadow:0 26px 50px -18px rgba(0,0,0,.65);overflow:hidden;display:block;transition:transform .2s}
.lipost:hover{transform:translateY(-3px)}
.lipost:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
.lipost.empty-post{cursor:default}.lipost.empty-post:hover{transform:none}
.lip-h{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.lip-h>span:nth-child(2){flex:1;min-width:0}
.lip-h b{display:block;font-size:14px;color:#1d2226}.lip-h small{display:block;font-size:11.5px;color:#666}
.lip-av{width:40px;height:40px;border-radius:6px;background:#0d314c;display:flex;align-items:center;justify-content:center;padding:6px;box-sizing:border-box;--logo-body:#fff;--logo-s:#74bfeb;flex:0 0 auto}
.avlogo{width:100%;height:auto}
.lip-b{margin:2px 14px 12px;font-size:13.5px;line-height:1.45;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.lip-b i{color:#666}
.lip-m{position:relative;aspect-ratio:16/9;background:#0d314c;overflow:hidden}
.lip-m img{width:100%;height:100%;object-fit:cover;display:block}
.lip-ph,.pl-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 30% 20%,#14486e,#06202f);--logo-body:#fff;--logo-s:#74bfeb;color:#a9d8f3;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12px}
.phlogo{width:44%;height:auto}
.livebadge{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:6px;background:#cc1016;color:#fff;font-size:11px;font-weight:700;letter-spacing:.1em;padding:3px 8px;border-radius:3px}
.livebadge i{width:7px;height:7px;border-radius:50%;background:#fff;animation:air 1.4s ease-in-out infinite}
.lip-ev{padding:10px 14px 12px;background:#f3f6f8;color:#1d2226;border-bottom:1px solid #e8e8e8}
.lip-ev small{display:block;font-size:10.5px;color:#b3372c;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.lip-ev b{display:block;font-size:14px;line-height:1.3;margin-top:2px}
.lip-link{margin:0 14px 12px;border:1px solid #e0e0e0;border-radius:6px;padding:10px 12px;background:#f3f6f8}
.lip-link b{display:block;font-size:13px}.lip-link small{color:#666;font-size:11.5px}
.lip-f{display:flex;justify-content:space-around;border-top:1px solid #e8e8e8;padding:9px 6px;font-size:12px;font-weight:600;color:#666}
/* YouTube: the player */
.player{background:#0b0f13;border-radius:10px;overflow:hidden;box-shadow:0 26px 50px -18px rgba(0,0,0,.7)}
.pl-v{position:relative;aspect-ratio:16/9;background:#000}
.pl-v img{width:100%;height:100%;object-fit:cover;display:block}
.pl-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:50px;border-radius:14px;border:0;background:rgba(235,104,52,.95);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.45);transition:transform .2s}
.pl-play:hover,.pl-play:focus-visible{transform:translate(-50%,-50%) scale(1.08);outline:none}
.pl-play svg{width:28px;height:28px;fill:#fff}
.pl-tag{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.78);color:#fff;font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:4px}
.player.live .pl-tag{background:#0f7b5c}
.pl-bar{display:flex;gap:3px;height:5px;background:#000}
.pl-bar i{flex:1;background:rgba(255,255,255,.2)}.pl-bar i.on{background:#eb6834}
.pl-t{padding:10px 14px 12px;color:#fff}
.pl-t b{display:block;font-size:14.5px;line-height:1.3}.pl-t small{font-size:12px;color:rgba(255,255,255,.6)}
.ytsteps{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:16px}
.yts{display:grid;grid-template-columns:20px minmax(0,1fr);gap:0 8px;align-items:center;background:var(--band-tile);border:1px solid var(--band-line);border-radius:6px;padding:7px 9px}
.yts span{grid-row:span 2;width:20px;height:20px;box-sizing:border-box;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.yts.on span{background:#4fc79b;border-color:#4fc79b;color:#06202f}
.yts b{font-size:12.5px}.yts small{font-size:11px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Summits: countdown, progress, and the run on one line */
.hero.summit{grid-template-columns:minmax(0,1fr) auto}
.hero.summit .tl{grid-column:1/-1}
.clock{display:flex;gap:8px;margin-top:14px}
.cl{background:linear-gradient(180deg,#14486e 0 50%,#103f60 50% 100%);border:1px solid var(--band-line);border-radius:8px;min-width:76px;padding:11px 8px 9px;text-align:center;position:relative;box-shadow:0 12px 22px -12px rgba(0,0,0,.7)}
.cl::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.4)}
.cl b{display:block;font-size:42px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cl span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--sky);font-weight:700;margin-top:7px}
.clock.live b,.clock b{font-size:42px}.clock.live b{color:#4fc79b}
.sring{width:150px;height:150px;border-radius:50%;background:conic-gradient(#e0a83c calc(var(--p)*1%),rgba(255,255,255,.12) 0);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;text-align:center}
.sring::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--band)}
.sring b,.sring span{position:relative}
.sring b{font-size:32px;line-height:1}
.sring span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--sky);font-weight:700;max-width:88px;margin-top:5px;line-height:1.3}
@media(max-width:900px){.hero.summit{grid-template-columns:minmax(0,1fr)}.sumstat{display:none}}
.tl-track{position:relative;height:42px;background:var(--band-tile);border:1px solid var(--band-line);border-radius:21px;margin:30px 8px 0}
.tl-ev{position:absolute;top:-6px;bottom:-6px;background:linear-gradient(180deg,#e0a83c,#c98500);border-radius:6px;box-shadow:0 0 0 4px rgba(224,168,60,.22);min-width:8px}
.tl-ev span,.tl-now span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:5px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.tl-ev span{color:#e0a83c}
.tl-now{position:absolute;top:-9px;bottom:-9px;width:2px;background:#fff;margin-left:-1px}
.tl-now span{color:#fff}
.tm{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid var(--band);padding:0;cursor:pointer;transition:transform .15s}
.tm:hover,.tm:focus-visible{transform:scale(1.6);z-index:2;outline:none}
.ph-before{background:#74bfeb}.ph-at{background:#e0a83c}.ph-after{background:#e87ba4}
.tm.ok,.tl-key i.ok{background:#4fc79b}.tm.late,.tl-key i.late{background:#f08579}
.tm.late{animation:tmlate 1.6s ease-in-out infinite}
@keyframes tmlate{50%{box-shadow:0 0 0 6px rgba(240,133,121,.28)}}
.tl-mo{position:relative;height:18px;margin:6px 8px 0}
.tlm{position:absolute;transform:translateX(-50%);font-size:10.5px;color:rgba(255,255,255,.55);font-weight:600}
.tl-key{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:rgba(255,255,255,.7);margin-top:6px}
.tl-key span{display:inline-flex;gap:5px;align-items:center}
.tl-key i{width:9px;height:9px;border-radius:50%;display:inline-block}
@media(max-width:600px){.hbig{font-size:40px}.ytsteps{grid-template-columns:1fr}.cl{min-width:0;flex:1;padding:9px 4px 7px}.cl b,.clock b{font-size:28px}.paper{transform:none}.wk{gap:4px}}
@media (prefers-reduced-motion:reduce){.pscan,.hlbl i,.livebadge i,.tm.late{animation:none}.paper,.lipost,.pb{transition:none}}

/* Mic'd Up kit: more copy, clips, guest answers */
.kmore{margin-top:10px;border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surface-2)}
.kmore summary{cursor:pointer;font-weight:600;font-size:13px}
.kmore .kcopy{margin-top:10px}
.kclips{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.kguest{border:1px solid var(--border);border-left:4px solid var(--sky);border-radius:6px;padding:10px 12px;background:var(--surface-2);font-size:13px;margin-bottom:8px}
.kguest p{margin:6px 0 0}.kguest ol{margin:6px 0 0;padding-left:20px}

/* System Health (Nov 7, 2026) */
.helpbody b.bad,.helpbody .bad{color:var(--bad)}
tr.click:focus-visible{outline:2px solid var(--sky,#74bfeb);outline-offset:-2px}
/* attached logos on a request (Nov 5, 2026) */
.nm-att{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line,#e5eef5)}
.nm-att-h{flex-basis:100%;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3,#7794aa)}
.nm-att figure{margin:0;width:120px;display:flex;flex-direction:column;gap:4px}
.nm-att img{width:120px;height:64px;object-fit:contain;background:#fff;border:1px solid var(--line,#e5eef5);border-radius:6px;padding:6px;box-sizing:border-box}
.nm-att figcaption{font-size:11.5px;color:var(--ink-2,#456179);text-align:center}
/* Help > Dates and Settings (Nov 7, 2026) */
.ds-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 0 6px}
.ds-row label{font-weight:600}
.ds-row .hint{flex-basis:100%;margin:0}
.ds-tbl input{width:100%;box-sizing:border-box;font:inherit;font-size:13.5px;padding:5px 7px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--ink)}
.ds-tbl input[type=date]{min-width:140px}
.ds-tbl tr.past input{color:var(--ink-3)}
.ds-tbl td:last-child{width:1%;white-space:nowrap}
.ds-tbl{table-layout:fixed;width:100%}.ds-tbl th{text-align:left}.ds-tbl td{padding:4px 6px}
.ds-hols{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:6px 24px;margin:0 0 4px}
.ds-h{display:grid;grid-template-columns:150px 1fr 28px;gap:8px;align-items:center}
.ds-h input,.ds-row input{font:inherit;font-size:13.5px;padding:5px 7px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--ink);min-width:0}
.ds-h.past input{color:var(--ink-3)}
.ds-x{width:28px;height:28px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--ink-2);font-size:16px;line-height:1;cursor:pointer;padding:0}
.ds-x:hover{color:var(--bad);border-color:var(--bad)}
@media(max-width:480px){.ds-hols{grid-template-columns:1fr}.ds-h{grid-template-columns:132px 1fr 28px}}
.ds-warn{background:var(--warn-soft,#fbf3e2);border:1px solid var(--warn);color:var(--ink);border-radius:6px;padding:10px 14px;margin:0 0 16px}
.ds-save{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
@media(max-width:640px){.ds-tbl thead{display:none}.ds-tbl,.ds-tbl tbody,.ds-tbl tr,.ds-tbl td{display:block;width:100%;box-sizing:border-box}
  .ds-tbl tr{padding:8px 0;border-bottom:1px solid var(--rule)}.ds-tbl td{border:0;padding:3px 0}.ds-tbl td:last-child{width:auto}}
#page-settings .subtabs{margin:0 0 16px}
/* System Health, Summit HQ's design (Nov 7, 2026) */
.hh-btn{position:relative;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:5px;padding:5px 10px 5px 9px;font:500 11.5px/1 var(--display,inherit);cursor:pointer;white-space:nowrap}
.hh-btn:hover{background:rgba(255,255,255,.18)}
.hh-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hh-btn .hh-dot{position:absolute;left:18px;top:3px;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);box-shadow:0 0 0 2px var(--navy,#0d314c)}
.hh-btn .hh-dot.ok{background:#72C08E}.hh-btn .hh-dot.warn{background:#E0A83C}.hh-btn .hh-dot.bad{background:#F08579}
@media(max-width:700px){.hh-btn span{display:none}}
@media(max-width:480px){.hh-btn{padding:5px 7px}.hqtop .mastrule{display:none}.hqtop .hqname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
#hh-bar{position:fixed;top:calc(var(--hq-h,56px) + 10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:140;display:flex;align-items:center;gap:12px;max-width:min(760px,calc(100vw - 32px));
  background:#FBE8E6;color:#7A1913;border:1px solid #A32219;border-radius:8px;padding:9px 10px 9px 14px;font:500 13px/1.4 var(--display,inherit);box-shadow:0 6px 20px rgba(13,49,76,.16)}
#hh-bar[hidden]{display:none}#hh-bar b{font-weight:700}
#hh-bar .hh-go{flex:0 0 auto;background:#A32219;color:#fff;border:0;border-radius:5px;padding:6px 11px;font:inherit;font-weight:600;cursor:pointer}
#hh-bar .hh-x{flex:0 0 auto;background:none;border:0;color:inherit;font-size:20px;line-height:1;padding:0 4px;cursor:pointer;opacity:.7}
.hh-modal{position:fixed;inset:0;z-index:150;background:rgba(6,32,47,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,4vh) 12px;overflow:auto}
.hh-box{width:min(860px,96vw);background:var(--surface);color:var(--ink);border-radius:10px;box-shadow:0 18px 50px rgba(6,32,47,.35);display:flex;flex-direction:column;max-height:92vh}
.hh-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--rule)}
.hh-hd b{font-size:16px}
.hh-body{padding:14px 18px 18px;overflow:auto}
.hh-body h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:16px 0 6px}
.hh-sum{display:flex;align-items:center;gap:10px;margin:2px 0 12px;font-size:13.5px}
.hh-big{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.hh-big.ok,.hh-row.ok::before{background:var(--good,#0F7B5C)}
.hh-big.warn,.hh-row.warn::before{background:var(--warn,#A2701A)}
.hh-big.bad,.hh-row.bad::before{background:var(--bad,#A32219)}
.hh-big.off,.hh-row.off::before{background:var(--ink-3)}
.hh-grid{columns:3 240px;column-gap:8px}
.hh-grid .hh-row{break-inside:avoid;margin:0 0 8px}
.hh-row{position:relative;border:1px solid var(--border);border-radius:6px;padding:9px 11px 9px 22px;background:var(--surface)}
